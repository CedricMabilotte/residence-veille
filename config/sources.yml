  # 2026-08-01 : exploration de https://www.cnap.fr/annonces/residence-ruralite
  # (demandée pour élargir la veille ruralité). Résultat : ce n'est PAS une page
  # de filtre/listing vivante mais la fiche FIGÉE d'une seule annonce (« Merveilleux
  # Prétexte », Tulle, dl 20/10/2025 — déjà expirée). Piège du même type que L1 :
  # une page unique prise pour un flux. Remplacée par les deux sources suivantes,
  # bien plus fiables (flux RSS officiel + listing filtré par type d'annonce).
  - label: "CNAP — flux RSS appels à projet (tous types)"
