# ─────────────────────────────────────────────────────────────────────────────
# sources.yml — Sources surveillées pour le fork « Résidence »
# ─────────────────────────────────────────────────────────────────────────────
# Sources de démarrage (à valider via scripts/probe_source.py avant intégration
# définitive). Voir INSTRUCTION-DEMARRAGE.md §4 pour la liste complète prévue.
#
# Champ `type` : html | deep_html | playwright | rss | jsonld_event
#   (html/deep_html/playwright extraient les liens d'annonces HTML d'une page
#    d'index ; playwright pour les sites rendus en JavaScript)
# Champ `peak_months` (optionnel) : modulation saisonnière (voir §12.4/I)
# ─────────────────────────────────────────────────────────────────────────────

# Seuil global (peut être surchargé par run via env SCORE_THRESHOLD)
threshold: 6

# ─────────────────────────────────────────────────────────────────────────────
# Sources de démarrage (≈ 12 sources pour le premier run de validation)
# ─────────────────────────────────────────────────────────────────────────────
sources:

  # ── A. Agrégateurs internationaux ──────────────────────────────────────────

  # TransArtists : la base /en/air renvoie 403 (anti-bot) ; la page « calls »
  # est en HTML statique et accessible.
  - label: "TransArtists — Open calls (EN)"
    url: "https://www.transartists.org/en/transartists-calls"
    type: deep_html
    max_pages: 20
    min_interval_days: 7
    peak_months: [1, 2, 3, 9, 10, 11]

  # Res Artis : /listings/ = annuaire de profils ; /open-calls/ = les appels.
  - label: "Res Artis — Open calls (EN)"
    url: "https://resartis.org/open-calls/"
    type: deep_html
    max_pages: 20
    min_interval_days: 7
    peak_months: [1, 2, 3, 9, 10, 11]

  - label: "On-the-Move — Funding (EN/FR/ES)"
    url: "https://on-the-move.org/funding/"
    type: deep_html
    max_pages: 15
    min_interval_days: 7

  # e-flux : annonces rendues en JS → Playwright.
  - label: "e-flux — Announcements (EN)"
    url: "https://www.e-flux.com/announcements/"
    type: playwright
    min_interval_days: 3

  # ── B. Institutionnels FR ──────────────────────────────────────────────────

  - label: "CNAP — soutien à la création"
    url: "https://www.cnap.fr/"
    type: deep_html
    max_pages: 12
    min_interval_days: 7
    peak_months: [1, 2, 3, 9, 10, 11]

  - label: "Fondation des Artistes"
    url: "https://www.fondationdesartistes.fr/"
    type: deep_html
    max_pages: 10
    min_interval_days: 14

  - label: "Institut français — résidences internationales"
    url: "https://www.institutfrancais.com/fr/programmes"
    type: deep_html
    max_pages: 15
    min_interval_days: 14

  # ── C. Prix et concours ────────────────────────────────────────────────────

  - label: "Salon de Montrouge — accueil"
    url: "https://salondemontrouge.com/"
    type: deep_html
    max_pages: 5
    min_interval_days: 14
    peak_months: [10, 11, 12, 1]

  # ── D. Lieux et fondations ─────────────────────────────────────────────────

  - label: "Cité internationale des arts — appels à candidature ouverts"
    # 2026-08-01 : URL corrigée une seconde fois. L'ancienne URL /nos-programmes-de-residence/
    # (ex /fr/residences, déjà corrigée une fois) liste l'ANNUAIRE DES PARTENARIATS EXISTANTS
    # (une page par institution partenaire type "Visarte Suisse x Cité"), PAS les appels à
    # candidature ouverts : ces pages n'ont ni date limite ni formulaire, l'artiste ne candidate
    # pas en direct (nomination par l'institution partenaire). 21 fiches erronées mises en
    # quarantaine le 2026-08-01 (voir discovery/reports/review_issues_2026-08-01.md) car
    # promues à tort avec ce crawl. La bonne page — celle qui porte réellement les échéances et
    # les boutons "Apply" — est /appels-a-candidature/ (ou /en/open-calls/ en anglais).
    url: "https://www.citeinternationaledesarts.fr/appels-a-candidature/"
    type: deep_html
    max_pages: 15
    min_interval_days: 7

  - label: "Pollen — résidence (Monflanquin)"
    url: "https://www.pollen-monflanquin.com/residences/"
    type: html
    min_interval_days: 14

  # Rurart — centre d'art contemporain (Vienne, FR). Suggestion communautaire
  # validée via issue #2.
  # ATTENTION (2026-08-01) : /programmation/ a produit 4 fiches en quarantaine
  # (rurart.org/exposition-*), qui sont des pages d'exposition déjà programmée/passée,
  # pas des appels à candidature. Même défaut que Cité internationale des arts
  # (voir plus haut) — pas encore trouvé l'URL de la vraie page d'appel de Rurart lors
  # de cette session ; à instruire manuellement avant le prochain run automatisé.
  - label: "Rurart — centre d'art / programmation"
    url: "https://www.rurart.org/programmation/"
    type: deep_html
    max_pages: 16
    min_interval_days: 14

  # ── E. Hispanophones ───────────────────────────────────────────────────────

  - label: "Hangar Barcelona — convocatòries"
    url: "https://hangar.org/en/category/convocatories-3/"
    type: deep_html
    max_pages: 12
    min_interval_days: 7

  - label: "MATADERO Madrid — convocatorias"
    url: "https://www.mataderomadrid.org/convocatorias"
    type: deep_html
    max_pages: 10
    min_interval_days: 7

  # ── F. Agrégateurs & institutions requalifiés (probe nouveau modèle HTML) ──
  # Sources validées via probe_source.py après le refactor « zéro PDF ».

  - label: "Curator Space — opportunities (EN)"
    url: "https://www.curatorspace.com/opportunities"
    type: deep_html
    max_pages: 25
    min_interval_days: 7

  - label: "Casa de Velázquez — Académie de France à Madrid"
    url: "https://www.casadevelazquez.org/"
    type: deep_html
    max_pages: 20
    min_interval_days: 14

  - label: "ADAGP — actualités (appels, bourses, prix)"
    url: "https://www.adagp.fr/fr/actualites"
    type: deep_html
    max_pages: 15
    min_interval_days: 14

  # ── G. Lieux, fondations & réseaux (résidences au cas par cas) ─────────────

  - label: "Documents d'Artistes PACA"
    url: "https://www.documentsdartistes.org/candidater.php"
    type: deep_html
    max_pages: 15
    min_interval_days: 14

  - label: "FRAC Île-de-France"
    url: "https://www.fraciledefrance.com/"
    type: deep_html
    max_pages: 12
    min_interval_days: 14

  - label: "Villa Albertine — appels résidences (USA)"
    url: "https://villa-albertine.org/va/fr/professionals/"
    type: deep_html
    max_pages: 12
    min_interval_days: 14

  - label: "Moly-Sabata — résidence (Sablons)"
    url: "https://www.moly-sabata.com/"
    type: html
    min_interval_days: 14

  # ── H. Lot ajouté 2026-08-01 (session manuelle Claude — élargissement) ────

  - label: "TransArtists — Open Calls (blog, EN)"
    # Distinct de « TransArtists — Open calls (EN) » plus haut (/en/transartists-calls,
    # deep_html sur liens d'annonces) : cette variante correspond à ce qui a été vérifié
    # manuellement le 2026-08-01 — page d'articles paginée (~50 pages), classée par date
    # de publication et non par échéance. Chaque article donne sa propre deadline dans
    # le texte ; beaucoup sont déjà expirées au moment du crawl (publication ancienne).
    # Un filtre post-extraction sur date_limite future est indispensable ici.
    url: "https://www.transartists.org/en/transartists-calls"
    type: deep_html
    max_pages: 10
    min_interval_days: 7

  - label: "O Castro Art Village — résidences (Galice, ES)"
    # Repéré via TransArtists le 2026-08-01. Résidence rurale autofinancée + volets
    # thématiques ponctuels soutenus par Culture Moves Europe. Fort potentiel de
    # résonance avec le profil interne (ruralité, matériaux locaux) — cf. fiche
    # organismes/o-castro-art-village-e1a2c3f4.yml.
    url: "https://ocastroartvillage.com/about-us/"
    type: deep_html
    max_pages: 8
    min_interval_days: 14

  - label: "DRAC Nouvelle-Aquitaine — aides et appels à projets"
    url: "https://www.culture.gouv.fr/regions/drac-nouvelle-aquitaine/aides-demarches"
    type: deep_html
    max_pages: 15
    min_interval_days: 14

  - label: "Ministère de la Culture — catalogue des appels à projets (national)"
    url: "https://www.culture.gouv.fr/catalogue-des-demarches-et-subventions/appels-a-projet-partenaires"
    type: deep_html
    max_pages: 20
    min_interval_days: 7

  - label: "Réseau d.c.a — association des centres d'art contemporain"
    url: "https://www.dca-art.com/"
    type: deep_html
    max_pages: 12
    min_interval_days: 14

  - label: "Devenir.art — appels à candidature (agrégateur FR)"
    url: "https://devenir.art/"
    type: deep_html
    max_pages: 15
    min_interval_days: 7

  - label: "Salon de Montrouge — modalités de candidature (page officielle des dépôts)"
    # Distinct de « Salon de Montrouge — accueil » plus haut (salondemontrouge.com, qui a
    # produit 3 fiches en quarantaine — pages d'actualité, pas l'appel). Ce sous-domaine est
    # la page de dépôt réelle, ouverte début avril / fin avril chaque année (cf. fiche
    # organismes/salon-de-montrouge-3c775399.yml, track_record).
    url: "https://candidats.salondemontrouge.fr/"
    type: html
    min_interval_days: 30
    peak_months: [3, 4]

  - label: "Triangle France — Astérides (Marseille)"
    url: "https://triangle-asterides.org/fr/appels/"
    type: deep_html
    max_pages: 10
    min_interval_days: 14

  - label: "Fondation Camargo (Cassis)"
    url: "https://camargofoundation.org/apply/"
    type: deep_html
    max_pages: 8
    min_interval_days: 14

  - label: "Prix AICA France"
    url: "https://www.aicafrance.org/"
    type: deep_html
    max_pages: 10
    min_interval_days: 30

  - label: "Prix Aware (femmes artistes)"
    url: "https://awarewomenartists.com/prix-aware/"
    type: deep_html
    max_pages: 8
    min_interval_days: 30
