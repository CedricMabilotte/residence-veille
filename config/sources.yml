# ─────────────────────────────────────────────────────────────────────────────
# sources.yml — Sources surveillées pour le fork « Résidence »
# ─────────────────────────────────────────────────────────────────────────────
# Sources de démarrage (à valider via scripts/probe_source.py avant intégration
# définitive). Voir INSTRUCTION-DEMARRAGE.md §4 pour la liste complète prévue.
#
# Champ `type` : html | deep_html | playwright | rss | jsonld_event
#   (html/deep_html/playwright extraient les liens d'annonces HTML d'une page
#    d'index ; playwright pour les sites rendus en JavaScript)
# Champ `peak_months` (optionnel) : modulation saisonnière (voir §12.4/I)
# ─────────────────────────────────────────────────────────────────────────────

# Seuil global (peut être surchargé par run via env SCORE_THRESHOLD)
threshold: 6

# ─────────────────────────────────────────────────────────────────────────────
# Sources de démarrage (≈ 12 sources pour le premier run de validation)
# ─────────────────────────────────────────────────────────────────────────────
sources:

  # ── A. Agrégateurs internationaux ──────────────────────────────────────────

  # TransArtists : la base /en/air renvoie 403 (anti-bot) ; la page « calls »
  # est en HTML statique et accessible.
  - label: "TransArtists — Open calls (EN)"
    url: "https://www.transartists.org/en/transartists-calls"
    type: deep_html
    max_pages: 20
    min_interval_days: 7
    peak_months: [1, 2, 3, 9, 10, 11]

  # Res Artis : /listings/ = annuaire de profils ; /open-calls/ = les appels.
  - label: "Res Artis — Open calls (EN)"
    url: "https://resartis.org/open-calls/"
    type: deep_html
    max_pages: 20
    min_interval_days: 7
    peak_months: [1, 2, 3, 9, 10, 11]

