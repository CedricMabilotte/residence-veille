  resume_fr: ArteSumapaz accueille une résidence artistique en Colombie pour les artistes
    de diverses disciplines (arts visuels, musique, écriture, danse, architecture,
    etc.). La résidence, d'une durée de 1 à 3 meses, offre des studios partagés et
    des espaces de travail sur un campus de 230 acres incluant un parc naturel. Les
    frais de logement s'élèvent à 1095 USD ou 1195 USD par mois selon la chambre,
    trois repas végétariens étant fournis quotidiennement. Les candidatures doivent
    être soumises avant le 2026-08-07, pour une résidence prévue du 2027-04-01 au
    2027-04-30. Les artistes doivent participer à une réunion communautaire hebdomadaire
    obligatoire et peuvent participer optionnellement à des critiques d'art hebdomadaires
    et des ateliers.
