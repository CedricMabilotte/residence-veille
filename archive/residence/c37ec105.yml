analyse:
  synthese: Resonance est un programme annuel de résidence de 3 mois pour artistes
    visuels, designers et commissaires. Initié en 2020, il propose 3 résidences par
    an en partenariat entre la Cité internationale des arts, l'Institut français du
    Nigeria et Art X Lagos. Le programme vise les professionnels basés au Nigeria
    ayant au moins 5 ans de pratique artistique ou curatoriale et âgés de plus de
    23 ans. Les résidents dialoguent avec des professionnels de leurs domaines et
    bénéficient d'une ouverture au réseau professionnel francilien et d'un soutien
    financier.
  pour_qui: Artistes visuels, designers et commissaires de toutes nationalités, résidant
    au Nigeria, ayant au moins 5 ans de pratique professionnelle établie et âgés de
    plus de 23 ans.
