analyse:
  synthese: Matadero Madrid ofrece 8 residencias de producción artística de 3 meses, del 15 de septiembre al 15 de diciembre
    de 2026, dirigidas a artistas visuales residentes en España que trabajen sobre medioambiente. El programa proporciona
    espacios de creación, recursos económicos, acompañamiento profesional y visibilidad institucional. Se seleccionarán mínimo
    4 artistas de la Comunidad de Madrid y máximo 4 del resto de España.
  para_quien: Artistas visuales individuales o colectivos residentes en España de mayoría de edad, con nacionalidad española,
