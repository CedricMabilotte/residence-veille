analyse:
  synthese: 'La Saison Pologne-France 2027 est un appel à projets lancé par l''Institut
    français pour soutenir des projets culturels français en Pologne. Cet appel s''adresse
    aux structures françaises et polonaises intéressées par la labellisation de projets.
    Les candidatures doivent être déposées avant le 22 juin 2026 via la plateforme
    IFProg. Les projets doivent s''inscrire dans l''une des quatre thématiques : démocratie
    et solidarités, Europe en partage, agentivité à l''ère algorithmique, ou relations
    franco-polonaises. Les disciplines couvertes incluent architecture, arts visuels,
    cinéma, création numérique, débat, livre, métiers d''art et spectacle vivant.'
