  resume_fr: JustArt Collective, une initiative d'artistes basée au Royaume-Uni, lance
    un appel à candidatures pour le numéro 6 de son journal d'art. Le thème est «
    Liquidity », explorant comment la mobilité des artistes et la migration façonnent
    l'identité et la pratique artistique. Les artistes et curateurs doivent soumettre
    5-8 images avec description et biographie, moyennant des frais de participation
