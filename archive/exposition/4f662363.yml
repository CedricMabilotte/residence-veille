analyse:
  synthese: Galeria 5ª ao Sul invites emerging and established artists worldwide to
    submit work for Materialities, an international contemporary art exhibition presented
    online in December 2026, exploring how matter and material processes shape contemporary
    artistic practice. Selected artists receive international online exhibition access,
    inclusion in official ISBN catalogue distributed globally by Amazon, dedicated
    artist profile on gallery website, digital certificate, and zero commission on
    artwork sales. Applications are free; selected artists pay €35-€75 participation
    fee depending on number of works accepted.
  pour_qui: Emerging and established artists aged 18+, worldwide, working in contemporary
    disciplines (painting, textile, sculpture, photography, digital art, video, installation,
    generative practices, performance documentation), interested in exploring materiality
    and engaging with the exhibition's curatorial theme.
a_savoir:
- Exhibition entirely online — no physical space, studio, equipment or on-site production
  time.
- 'Pay-to-play structure: €35-€75 participation fee charged after selection.'
- 'Very short timeline: 3 weeks from submission deadline (20 Nov) to exhibition opening
  (10 Dec).'
- No artist remuneration, per diem or housing provided.
- Physical artworks displayed solely through high-resolution digital documentation.
- Visible selection criteria published; rapid notification timeline (selected by 24
  Nov).
