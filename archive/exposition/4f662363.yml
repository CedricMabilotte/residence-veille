  resume_fr: 'Galeria 5ª ao Sul (Portugal) invite les artistes émergents et confirmés
    à soumettre leurs œuvres pour une exposition en ligne en décembre 2026, explorant
    comment la matière et les matériaux façonnent la pratique artistique contemporaine.
    Les candidatures sont gratuites et ouvertes à diverses disciplines artistiques
    : peinture, sculpture, textile, photographie, art vidéo, art numérique, installation
    et formes expérimentales. Les artistes sélectionnés bénéficieront d''une exposition
    internationale en environnement virtuel, d''une inclusion au catalogue officiel,
    d''un profil dédié sur le site de la galerie, d''un certificat numérique de participation
    et d''une commission zéro sur les ventes. L''exposition présentera les œuvres
    par documentation numérique haute qualité dans une galerie 3D virtuelle. Date
    limite de candidature : 20/11/2026.'
