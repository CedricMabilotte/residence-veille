  resume_fr: Le SPARK est un programme de soutien destiné aux artistes et producteurs
    en début de carrière intéressés par le travail avec la lumière, basé à Lancaster
    et Wigan au Royaume-Uni. Jusqu'à 6 personnes seront sélectionnées (3 artistes
    et 3 producteurs) et recevront des bourses de £300 plus jusqu'à £600 supplémentaires
    pour les frais de déplacement, d'hébergement et de subsistance. Le programme se
    déroulera sur 2 weekends en novembre 2026, parallèlement aux festivals Light Up
    Lancaster (5-7 Nov) et Light Night Wigan (20-22 Nov), avec ateliers informels,
    mentorat, réseautage et conférences. Les candidatures doivent être envoyées avant
    le 22/05/2026 et peuvent inclure des formats non-écrits d'une durée maximale de
    6 minutes. Les entretiens se tiendront via Zoom la semaine du 1er juin, avec notification
    des résultats au plus tard le lundi 8 juin.
