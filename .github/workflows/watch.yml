name: Veille opportunités

# 2026-08-01 : ajout du déclencheur `schedule`. Jusqu'ici ce workflow ne se
# déclenchait QUE manuellement (workflow_dispatch) — vérifié via
# `gh api repos/.../actions/runs` : les ~25 runs historiques sont TOUS
# `event: workflow_dispatch`, aucun `schedule`. Le pipeline n'avait donc
# jamais tourné tout seul ; il attendait qu'un humain clique "Run workflow".
# Personne ne l'a fait depuis le 22 mai 2026, d'où 2,5 mois d'écart constatés
# le 1er août. Voir etat-projet-Residences-artistiques.md pour le diagnostic complet.
on:
  workflow_dispatch:
    inputs:
      score_threshold:
        description: "Seuil de pertinence (0–10, défaut : 6)"
        default: "6"
        required: false
      dry_run:
        description: "Simulation sans persistance (true/false)"
        default: "false"
        required: false
      do_discovery_weekly:
        description: "Lance les discoveries hebdo (Mastodon, network_pages)"
        default: "false"
        required: false
      do_discovery_monthly:
        description: "Lance les discoveries mensuelles (LLM suggest, blind spots, enrich organismes)"
        default: "false"
        required: false
      do_rescore:
        description: "Re-score les fiches existantes (appels/) avec le scoring courant — usage ponctuel après un changement de barème/filtre, pas une cadence régulière"
        default: "false"
        required: false
  schedule:
    # Veille quotidienne. GitHub désactive automatiquement un workflow planifié
    # après 60 jours d'inactivité du dépôt (aucun commit/push) — un dépôt qui
    # reçoit ses propres commits de veille chaque jour ne devrait pas être
    # concerné, mais si le job échoue en boucle sans jamais committer, ce
    # risque redevient réel. D'où l'alerte GitHub Issue ajoutée plus bas.
    - cron: "0 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Résoudre les paramètres (dispatch manuel vs cron)
        id: params
        run: |
          # github.event.inputs.* n'existe que pour workflow_dispatch. Sur un
          # déclenchement schedule, on calcule des valeurs par défaut sûres :
          # discovery hebdo le lundi, mensuelle le 1er du mois, jamais de dry_run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "score_threshold=${{ github.event.inputs.score_threshold }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "do_weekly=${{ github.event.inputs.do_discovery_weekly }}" >> "$GITHUB_OUTPUT"
            echo "do_monthly=${{ github.event.inputs.do_discovery_monthly }}" >> "$GITHUB_OUTPUT"
            echo "do_rescore=${{ github.event.inputs.do_rescore }}" >> "$GITHUB_OUTPUT"
          else
            echo "score_threshold=6" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            [ "$(date -u +%u)" = "1" ] && echo "do_weekly=true" >> "$GITHUB_OUTPUT" || echo "do_weekly=false" >> "$GITHUB_OUTPUT"
            [ "$(date -u +%d)" = "01" ] && echo "do_monthly=true" >> "$GITHUB_OUTPUT" || echo "do_monthly=false" >> "$GITHUB_OUTPUT"
            echo "do_rescore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installation des dépendances Python
        run: pip install requests beautifulsoup4 pyyaml playwright

      - name: Installation de Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Installation de Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Veille principale
        id: veille
        # continue-on-error : si le scraping/l'extraction Claude échoue (ex. token expiré,
        # source down), on ne veut PAS que tout le pipeline s'arrête en silence — sinon
        # deadline_tracker ne tourne plus, le site ne se régénère plus, et personne ne le
        # remarque (c'est exactement ce qui a pu se reproduire pendant 2,5 mois). On
        # continue vers le tri des échéances + la régénération du site avec les données
        # existantes, et on alerte via l'étape "Notifier en cas d'échec" en fin de job.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCORE_THRESHOLD:         ${{ steps.params.outputs.score_threshold }}
          DRY_RUN:                 ${{ steps.params.outputs.dry_run }}
        run: python scripts/watch.py

      - name: "Re-scoring ponctuel (barème corrigé + filtre discipline resserré, 2026-08-02)"
        # Gaté sur do_rescore (déclenché manuellement une fois, pas une cadence
        # régulière) — nécessite Claude (CLAUDE_CODE_OAUTH_TOKEN), donc ne peut
        # pas tourner en session Cowork locale (auth CLI expirée constatée en
        # session). Voir scripts/rescore_existing.py pour le détail et la portée
        # (appels/ uniquement, jamais archive/).
        if: ${{ steps.params.outputs.dry_run != 'true' && steps.params.outputs.do_rescore == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/rescore_existing.py

      - name: Tri par échéance (deadline_tracker)
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: python scripts/deadline_tracker.py

      - name: Détection des cycles annuels
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: python scripts/discovery_cycles.py || echo "  cycles skipped"

      - name: Graphe partenariats
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: python scripts/discovery_partnerships.py || echo "  partnerships skipped"

      - name: Patterns d'archive (laureat·es éditions précédentes)
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: python scripts/discovery_editions_archive.py || echo "  editions_archive skipped"

      - name: Audit auto-promotion (garde-fou drift)
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/discovery_audit.py || echo "  audit skipped"

      - name: "Discovery hebdomadaire (Mastodon, network_pages, annuaires institutionnels)"
        # 2026-08-02 : ce step tournait tous les jours alors que INSTRUCTION-DEMARRAGE.md
        # §12.1 documente une cadence Hebdo pour discovery_mastodon.py (network_pages n'a
        # pas de cadence documentée, rattaché ici par cohérence). L'input do_discovery_weekly
        # existait dans workflow_dispatch et était calculé par l'étape "params" (vrai les
        # lundis en cron) mais n'était consommé par aucun step — branché maintenant pour
        # que la cadence documentée corresponde à la cadence réelle. La veille principale
        # (scraping des sources déjà connues) reste quotidienne — seule la découverte de
        # *nouvelles* sources candidates passe à l'hebdomadaire.
        if: ${{ steps.params.outputs.dry_run != 'true' && steps.params.outputs.do_weekly == 'true' }}
        run: |
          python scripts/discovery_mastodon.py                    || echo "  mastodon skipped"
          python scripts/discovery_network_pages.py               || echo "  network_pages skipped"
          python scripts/discovery_institutional_directories.py   || echo "  institutional_directories skipped"

      - name: "Discovery mensuelle (LLM suggest, blind spots)"
        # Nom corrigé le 2026-08-02 : ce step ne tournait déjà que mensuellement
        # (condition do_monthly ci-dessous) — le nom "hebdomadaire/mensuelle" était trompeur.
        if: ${{ steps.params.outputs.do_monthly == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/discovery_llm_suggest.py  || echo "  llm_suggest skipped"
          python scripts/discovery_blind_spots.py  || echo "  blind_spots skipped"

      - name: Review Issues GitHub (suggestions communautaires)
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RESIDENCE_PUBLISH_TOKEN }}
        run: python scripts/review_issues.py || echo "  review_issues skipped"

      - name: Enrichissement des fiches organismes
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/enrich_organismes.py || echo "  enrich_organismes skipped"

      - name: Génération du site HTML public
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: python scripts/generate_site.py

      - name: Commit reports + appels + organismes + discovery + archive
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: |
          git config --global user.name  "Residence Bot"
          git config --global user.email "bot@residence.local"

          # git add -A : tout ajouter (sauf .gitignore). Plus fiable que des chemins
          # explicites qui peuvent échouer si l'un d'eux n'existe pas.
          git add -A

          echo "── Fichiers stagés ──"
          git diff --staged --name-status | head -40

          if git diff --staged --quiet; then
            echo "→ Aucun changement à committer."
          else
            git commit -m "veille: $(date '+%Y-%m-%d %H:%M') — opportunités + organismes + discoveries"
            # Robustesse : si push diverge (push manuel concurrent), pull rebase puis re-push
            for i in 1 2 3; do
              if git push 2>&1; then
                break
              fi
              echo "→ push échoué, rebase puis retry ($i/3)"
              git pull --rebase origin main || true
            done
          fi

      - name: Publier vers residence.actitude.org (repo public)
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.RESIDENCE_PUBLISH_TOKEN }}
        run: |
          if [ ! -d site/ ] || [ -z "$(ls -A site/ 2>/dev/null)" ]; then
            echo "→ site/ vide — publication différée"
            exit 0
          fi
          ls -la site/ | head -20

          git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/CedricMabilotte/residence-actitude-org.git" /tmp/residence
          # Conserve .git du repo public et CNAME ; remplace tout le reste
          rsync -a --delete --exclude='.git' site/ /tmp/residence/
          cd /tmp/residence
          git config user.name  "Residence Bot"
          git config user.email "bot@residence.local"
          git add -A
          if git diff --staged --quiet; then
            echo "→ Aucun changement à publier."
          else
            git commit -m "publish: veille $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              if git push origin main 2>&1; then
                echo "→ Publié sur residence.actitude.org"
                break
              fi
              echo "→ push public échoué, rebase puis retry ($i/3)"
              git pull --rebase origin main || true
            done
          fi

      - name: Notifier en cas d'échec (issue GitHub)
        # Se déclenche si une étape sans continue-on-error a fait échouer le job,
        # OU si "Veille principale" a échoué (tolérée en continue-on-error, mais
        # pas invisible pour autant). Sans cette étape, un échec silencieux peut
        # durer des mois avant d'être remarqué — c'est précisément ce qui s'est
        # produit du 22 mai au 1er août 2026. Réutilise une issue existante au
        # lieu d'en recréer une à chaque run pour éviter le spam.
        if: ${{ failure() || steps.veille.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ Échec de la veille automatisée"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Le run du $(date -u '+%Y-%m-%d %H:%M UTC') a échoué (étape « Veille principale » ou une étape suivante). Détail : ${RUN_URL}. Vérifier en priorité la validité des secrets CLAUDE_CODE_OAUTH_TOKEN et RESIDENCE_PUBLISH_TOKEN."
          EXISTING=$(gh issue list --state open --search "in:title Échec de la veille automatisée" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "→ notification échouée (permissions issues ?)"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "→ notification échouée (permissions issues ?)"
          fi
