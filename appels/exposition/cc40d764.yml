analyse:
  synthese: ANCA offers professional visual arts studios in Canberra for artists working
    in all mediums, ranging from 32 to 100 square meters. Studios include sink, lighting,
    high ceilings, concrete floor, 24-hour access, free parking, and integration into
    a community of over 40 studio artists. Rental fees start at $270 per month. Artists
    participate in tenant meetings, cleaning duties, working bees, and specialist
    committees. ANCA Gallery provides exhibition opportunities, and the annual Open
    Studios event connects studios to the public.
  pour_qui: Professional visual artists permanently based in the Canberra region seeking
    long-term, affordable studio space within an established artist-run community.
a_savoir:
- ANCA is currently unable to accept submissions at the time of this page capture
- No fixed deadline; applications accepted year-round
- 'Average waiting time after acceptance: 3–6 months before studio availability'
- 'Mandatory participation required: ~6 tenant meetings/year, ~8 hours cleaning/year,
  2 working bees/year, mandatory specialised committee participation for at least
  1 year'
- Disabled toilet access available only at ANCA Dickson location
- Studio alterations require ANCA board approval and must be removed upon vacating
- Rental fees based on studio size, not inclusive of utilities or other costs
- Long waiting list expected due to community demand
