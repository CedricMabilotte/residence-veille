analyse:
  synthese: 'La Saison Méditerranée 2026 est une initiative gouvernementale française
    du 15 mai au 31 octobre 2026, principalement en France et rayonnant sur les rives
    méditerranéennes. Elle comprend plus de 500 événements pluridisciplinaires (architecture,
    arts visuels, cinéma, création numérique, débat d''idées, littérature, métiers
    d''art, spectacle vivant, musique) et s''appuie sur 5 thématiques : utopies spéculatives,
    identités plurielles, spiritualités contemporaines, histoire collective des migrations,
    construction des récits. L''appel à projets pour structures s''est déroulé en
    deux phases et est désormais clos.'
  pour_qui: Structures culturelles (centres d'arts, compagnies, festivals, institutions)
    portant des projets pluridisciplinaires en lien avec les cultures et enjeux méditerranéens.
