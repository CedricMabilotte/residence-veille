analyse:
  synthese: 'La Saison Méditerranée 2026 est un programme porté par le ministère de
    l''Europe et des Affaires étrangères et le ministère de la Culture, mis en œuvre
    par l''Institut français. Elle met en lumière la créativité et la diversité des
    cultures des rives de la Méditerranée entre le 15 mai et le 31 octobre 2026, sur
    l''ensemble du territoire français et les rives méditerranéennes. Le programme
    s''articule autour de 5 thématiques : les utopies spéculatives, les identités
    plurielles, les spiritualités contemporaines, l''histoire collective des migrations,
    et la construction des récits. L''appel à projets pour les structures, organisé
    en deux phases, est désormais clos.'
  pour_qui: Artistes, créateurs, créatrices et jeunes talents des rives de la Méditerranée
    travaillant dans les disciplines reconnues par le programme.
