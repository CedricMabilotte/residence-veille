analyse:
  synthese: 'La Saison Méditerranée 2026 est une initiative gouvernementale française
    (ministères de l''Europe, Affaires étrangères et Culture) mise en œuvre par l''Institut
    français, qui se déploie du 15 mai au 31 octobre 2026 sur le territoire français
    et sur les rives méditerranéennes. Elle célèbre les cultures, artistes et jeunes
    talents des régions méditerranéennes via plus de 500 événements autour de cinq
    thématiques : utopies spéculatives, identités plurielles, spiritualités contemporaines,
    migrations, construction des récits. L''appel à projets pour structures (organisations
    culturelles, festivals, centres d''arts) est désormais clos ; les résultats (structures
    labellisées) sont publiés.'
  pour_qui: Structures culturelles, festivals, organisations artistiques et créateurs
    collectifs des rives méditerranéennes et de France souhaitant participer à une
    saison de coopération culturelle et échanges transnationaux (appel clos).
a_savoir:
- Appel à projets clos — aucune candidature en cours. Cette page présente les résultats,
  non un appel actif.
- Cet appel était destiné à des structures et organisations, non à des artistes individuels.
- 'Plus de 500 événements prévus : amplitude très large, diversité disciplinaire complète.'
- Coopération gouvernementale multinationale (Maroc, Algérie, Tunisie, Égypte, Liban
