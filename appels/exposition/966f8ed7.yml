analyse:
  synthese: 'La Saison Méditerranée 2026 est un programme culturel du ministère de
    l''Europe et des Affaires étrangères, mis en œuvre par l''Institut français, s''échelonnant
    du 15 mai au 31 octobre 2026. Elle regroupe plus de 200 événements en France et
    sur les rives méditerranéennes, couvrant 11 disciplines artistiques. Elle s''organise
    autour de 5 thématiques : les utopies spéculatives, les identités plurielles,
    les spiritualités contemporaines, l''histoire collective des migrations et la
    construction des récits. L''appel à projets pour les structures est désormais
    clos.'
