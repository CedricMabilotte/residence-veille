analyse:
  synthese: 'La Saison Méditerranée 2026 est une initiative gouvernementale (ministères
    de l''Europe et des Affaires étrangères, et de la Culture) mise en œuvre par l''Institut
    français. Elle se déroulera du 15 mai au 31 octobre 2026 et comprendra plus de
    200 événements en France, avec rayonnement sur les rives méditerranéennes. La
    saison est structurée autour de 5 thématiques : utopies spéculatives, identités
    plurielles, spiritualités contemporaines, histoire des migrations, construction
    des récits. L''appel à projets (désormais clos) visait les structures culturelles
    de France et du bassin méditerranéen, couvrant 11 disciplines artistiques.'
  pour_qui: Institutions, festivals, structures culturelles et collectifs artistiques
    des rives méditerranéennes souhaitant participer à une saison dédiée aux échanges
    culturels et à la création méditerranéenne.
