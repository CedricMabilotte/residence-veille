analyse:
  synthese: 'L''Institut français propose au réseau culturel une offre de programmation
    « clé-en-main » mettant en avant la création numérique française. Il fournit des
    droits de diffusion non commerciale, les fichiers des œuvres et un kit de communication
    complet pour des présentations in situ. Cette offre couvre trois domaines : la
    série courte digitale (Binge), le catalogue XR et une exposition numérique (Escape,
    générations numériques). L''organisation et le financement de l''événement restent
    entièrement à la charge de l''établissement accueillant.'
  pour_qui: Les établissements du réseau culturel français à l'étranger et leurs partenaires
    souhaitant intégrer de la création numérique française à leur programmation.
a_savoir:
- Ce n'est pas un appel à candidature pour artistes, mais une offre de programmation
  pour institutions du réseau culturel.
- Les établissements doivent organiser et financer entièrement l'événement sur place.
- Les droits de diffusion sont non commerciaux à l'étranger uniquement.
