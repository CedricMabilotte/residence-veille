analyse:
  synthese: 'British Textile Biennial and The Harris co-commission an interactive
    artwork incorporating textiles for the BTB10 anniversary exhibition at The Harris,
    Preston (29 May – 31 August 2027). The successful artist or collective receives
    £10,000 covering fees, materials, fabrication, travel and project expenses, plus
    curatorial and production support. The work will occupy 3 m × 6.6 m in the exhibition''s
    central room and must respond to themes explored across BTB''s decade-long programme:
    labour, place, materials, sustainability and changing relationships with textiles.
    Artists from all career stages and disciplines are welcome; previous commission
    experience is useful but not essential.'
  pour_qui: Individual artists, designers, makers, or collectives with experience
    or demonstrated capacity in creating participatory, interactive, public-facing
    work that engages audiences across generations.
a_savoir:
- Limited budget (£10,000) must cover artist fees, materials, fabrication, and travel
  across ~6 months
- 'Tight timeline: deadline 20 November 2026; interviews early December; installation
  May 2027'
- Precise spatial constraints (3 m × 6.6 m with 4.1 m hanging height) require careful
  spatial planning and consideration of visitor flow
- Work must remain durable, accessible and engaging for public interaction throughout
  3-month exhibition run with no guaranteed maintenance support
- Artist may be responsible for durability, technical support, maintenance or material
  replacement depending on work form
- No guaranteed post-exhibition life or future presentation; opportunities would be
  explored after selection
