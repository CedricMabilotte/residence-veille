analyse:
  synthese: La MABA est un centre d'art de la Fondation des Artistes créé en 2006
    pour accompagner la production et la diffusion de la création contemporaine. Le
    centre organise 3 expositions par an de format monographique ou collectif, destinées
    à promouvoir les projets expérimentaux d'artistes de toutes nationalités. La programmation
    s'articule autour de la création contemporaine, de l'image fixe et animée, et
    du design graphique, accompagnée d'actions de médiation (visites-découvertes,
    rencontres avec artistes, conférences). Les expositions font l'objet d'une itinérance
    dans des écoles d'art partenaires.
  pour_qui: Cette page ne cible pas les artistes candidats mais décrit plutôt les
    missions et fonctionnement du centre pour le public général.
