analyse:
  synthese: Le CNAP propose une aide à la production artistique destinée aux Frac
    et centres d'art labellisés dans le cadre de la Quinquennale 2027 (octobre 2027,
    trois mois). Les bénéficiaires peuvent demander 10 000 € ou 15 000 € pour produire
    des œuvres destinées à une exposition labellisée Quinquennale. Les artistes doivent
    être de la scène française (nationalité française ou résidence permanente en France)
    ; en exposition collective, au minimum 60 % doivent être français. Le soutien
    couvre la rémunération des artistes, les frais de résidence, le transport des
    œuvres, et les frais de production. L'exposition doit se tenir entre le 1er septembre
    2027 et le 30 juin 2028, en coproduction ou partenariat.
  pour_qui: Les Frac et centres d'art labellisés d'intérêt national ou conventionnés
    par le ministère de la Culture, souhaitant coproduire des expositions avec des
    artistes de la scène française dans le cadre de la Quinquennale 2027.
