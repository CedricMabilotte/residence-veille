analyse:
  synthese: Le Cnap propose un dispositif de soutien à la production destiné aux Frac
    et centres d'art labellisés, finançant la création et la présentation d'expositions
    en lien avec la Quinquennale 2027 (octobre 2027, trois mois). Le soutien couvre
    la recherche et production des œuvres, la rémunération des artistes et commissaires,
    ainsi que les frais de transport, à hauteur de 10 000 € ou 15 000 € avec cofinancement
    50-50. Les expositions doivent intégrer principalement des artistes français (minimum
    60 % en cas de collectif) et peuvent se tenir entre septembre 2027 et juin 2028.
    Les candidatures sont à déposer en ligne du 11 mai au 18 juin 2026 à 13h.
  pour_qui: Frac et centres d'art labellisés conventionnés par le ministère de la
    Culture, proposant une exposition en partenariat avec des artistes de la scène
    française en lien avec la Quinquennale 2027.
a_savoir:
- Appel destiné aux structures intermédiaires (Frac/centres d'art), non aux artistes
  individuels
- Nouveau dispositif du Cnap, pas d'historique d'éditions précédentes
- Obligation d'au moins 60 % d'artistes français en cas d'exposition collective
- Montants limités (10 000 € ou 15 000 €) avec cofinancement obligatoire
- Production ne peut pas avoir débuté avant la tenue du comité (juillet 2026)
- Dossier en français requis
