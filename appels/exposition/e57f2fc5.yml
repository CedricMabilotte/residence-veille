  resume_fr: AURA est une galerie féministe en ligne pour les artistes et écrivaines
    s'identifiant comme femmes, actuellement présente sur Instagram et en expansion
    vers TikTok. L'appel recherche des essais d'art, des performances, des commentaires
    sociaux, des œuvres vidéo et des travaux socialement engagés adaptés au format
    des vidéos TikTok et Reels. Les candidates peuvent soumettre autant de travaux
    qu'elles le souhaitent. L'objectif est de redéfinir la zine d'art à l'ère numérique
    et de diffuser des œuvres féministes engagées. Actuellement, cet appel n'accepte
    pas de candidatures.
