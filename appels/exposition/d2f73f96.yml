  resume_fr: Le programme SPARK soutient les artistes et producteurs en début de carrière
    travaillant avec la lumière. Six participants (3 artistes, 3 producteurs) seront
    sélectionnés et recevront une bourse de £300 chacun, plus jusqu'à £600 supplémentaires
    pour les frais de déplacement et logement. Le programme se déroulera sur 2 weekends
    en novembre 2026 durant les festivals Light Up Lancaster (5-7 Nov) et Light Night
    Wigan (20-22 Nov), proposant ateliers, mentorat et networking. La date limite
    de candidature est le 22/05/2026. Les candidats shortlistés seront interviewés
    durant la semaine du 1 juin, avec les résultats communiqués au plus tard le lundi
    8 juin.
