analyse:
  synthese: Le programme SPARK de Light Up The North offre une formation et un mentorat
    à six artistes et producteurs émergents intéressés par l'art lumineux. Les participants
    sélectionnés participent à des ateliers informels, des événements de réseautage
    et du mentorat programmés autour de deux festivals partenaires (Light Up Lancaster
    et Light Night Wigan) au cours de deux week-ends en novembre 2026. Chaque participant
    reçoit une bourse de £300 pour participer, plus jusqu'à £600 supplémentaires pour
    couvrir voyage, logement et frais de subsistance. Le programme est gratuit pour
    postuler. L'organisme encourage activement les candidatures d'artistes actuellement
    sous-représentés dans le secteur des festivals de lumière.
  pour_qui: Artistes et producteurs émergents et en début de carrière basés au Royaume-Uni,
