analyse:
  synthese: Le PIDA (Programme International de Diffusion Artistique) est un appel
    à projets de l'Institut français ouvert du 1er juillet au 30 octobre 2026, soutenu
    par le ministère de l'Europe et des Affaires étrangères et le ministère de la
    Culture. Il accompagne des projets de diffusion, de coopération ainsi que la présence
    d'artistes français au sein de grandes manifestations prescriptrices internationales.
    Il s'adresse au réseau culturel français à l'international, aux structures culturelles
    françaises, aux artistes français ou basés en France, et aux structures culturelles
    étrangères. Les huit disciplines couvertes sont l'architecture, les arts visuels,
    la création numérique, la photographie, le design, les métiers d'art, la musique
    et le spectacle vivant.
  pour_qui: Artistes français ou basés en France, structures culturelles françaises
    ou étrangères, réseau diplomatique français, et commissaires d'exposition ou collectifs
    souhaitant promouvoir la création artistique française à l'international.
