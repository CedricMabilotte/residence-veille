analyse:
  synthese: Le PIDA est un appel à projets de l'Institut français soutenant la diffusion
    de la création artistique française à l'international, financé par le ministère
    de l'Europe et des Affaires étrangères et le ministère de la Culture. Le programme
    s'adresse au réseau diplomatique, aux équipes artistiques françaises ou basées
    en France, et aux structures culturelles françaises ou étrangères. Il accompagne
    des projets de diffusion, de coopération et la présence d'artistes français au
    sein de grandes manifestations prescriptrices à l'international. Candidatures
    ouvertes du 1er juillet au 30 octobre 2026.
  pour_qui: Équipes artistiques françaises ou basées en France (artistes, scénographes,
    commissaires, collectifs, compagnies) et structures culturelles françaises ou
    étrangères désirant diffuser ou accueillir de la création artistique française
    à l'international.
