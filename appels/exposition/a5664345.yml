analyse:
  synthese: 'Le PIDA est l''appel à projets de l''Institut français destiné à la diffusion
    de la création artistique française à l''international. Il s''adresse à l''Institut
    français et son réseau diplomatique, aux équipes et institutions culturelles françaises,
    et aux structures étrangères accueillant des artistes français. Le programme couvre
    8 disciplines : architecture, arts visuels, photographie, création numérique,
    design, métiers d''art, musiques, et spectacle vivant. Il accompagne des projets
    de diffusion, de coopération ainsi que la présence d''artistes français au sein
    de grandes manifestations prescriptrices.'
  pour_qui: Artistes français, collectifs, compagnies, commissaires, institutions
    culturelles françaises (festivals, musées, centres d'art, studios, labels) et
    structures étrangères accueillant des artistes français en diffusion ou coopération.
