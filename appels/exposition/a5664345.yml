analyse:
  synthese: 'Le PIDA (Programme International de Diffusion Artistique) de l''Institut
    français soutient des projets de diffusion, de coopération et la présence d''artistes
    français dans de grandes manifestations internationales. Il s''adresse au réseau
    culturel français à l''international, aux institutions et structures culturelles
    françaises (musées, festivals, studios, labels), aux artistes et collectifs français,
    ainsi qu''aux structures étrangères accueillant des artistes français. Le programme
    couvre 8 disciplines : architecture, arts visuels, photographie, création numérique,
    design, métiers d''art, musiques et spectacle vivant. Il est soutenu par le ministère
    de l''Europe et des Affaires étrangères et le ministère de la Culture. La date
    limite de dépôt est le 30 octobre 2026.'
  pour_qui: Artistes français, équipes artistiques basées en France, structures culturelles
    françaises ou étrangères souhaitant accueillir ou diffuser des artistes français
    à l'international.
