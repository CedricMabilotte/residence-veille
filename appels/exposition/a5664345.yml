analyse:
  synthese: Le PIDA est un appel à projets lancé par l'Institut français pour soutenir
    la diffusion de la création artistique française à l'international. Il s'adresse
    aux structures culturelles françaises, équipes artistiques, artistes, collectifs
    et institutions étrangères accueillant des artistes français. Le programme couvre
    huit disciplines (architecture, arts visuels, photographie, création numérique,
    design, métiers d'art, musique, spectacle vivant). Les conditions précises de
    financement et les modalités d'accompagnement des projets ne sont pas détaillées
    dans ce document de présentation générale.
  pour_qui: Artistes, collectifs et structures culturels français ou basés en France,
    ainsi que structures culturelles étrangères accueillant la création artistique
    française pour des projets de diffusion et coopération internationale.
