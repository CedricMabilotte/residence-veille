analyse:
  synthese: The 2027 International Triennial of Textile Arts is a submission-based
    collective exhibition held triennially by the Cultural Foundation for the Textile
    Arts. Artists worldwide are invited to submit works in three categories (Wall
    and Spatial Textiles, Textile Design, Miniature Textiles) created between 2024
    and 2027, responding to the theme 'Interwoven Generation.' Works must use fibrous
    materials and traditional techniques (weaving, spinning, or related) and not exceed
    2.5 × 2.5 × 2.5 meters. The event has 50 years of history, attracting artists
    from 29 countries across 5 continents in its last edition. No production support,
    funding, accommodation, or per diem is provided.
  pour_qui: Textile artists at all career levels practicing traditional or conceptual
    fibre-based art; EU-based for most categories, with international participation
    in the Miniature Textiles category.
a_savoir:
- Submission-based exhibition, not a residency or production support program.
- 'Strict dimensional limit: works must not exceed 2.5 × 2.5 × 2.5 meters in any direction.'
- 'Thematic requirement: works must connect to ''Interwoven Generation'' (directly
  or abstractly).'
- EU-only eligibility introduced for Wall and Spatial Textiles and Textile Design
  categories (new policy for 2027).
- Zero financial support, production funding, travel reimbursement, or accommodation
  offered.
- Only works created after 2024 are eligible.
- 'Triennial format: opportunity recurs every 3 years only.'
- Detailed submission requirements in separate PDF document (call-for-entries_2027.pdf).
