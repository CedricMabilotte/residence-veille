  resume_fr: 'L''appel à candidatures pour la Triennial Internationale des Arts Textiles
    2027 de la Cultural Foundation for the Textile Arts (Budapest, Hongrie) ferme
    le 08.02.2027. Le thème de cette édition est « Interwoven Generation ». Les œuvres
    doivent être réalisées en matière fibreuse (tissage, filage ou techniques connexes),
    ne pas dépasser 2.5 × 2.5 × 2.5 mètres et dater de 2024 à 2027. Trois catégories
    sont proposées : Wall and Spatial Textiles, Textile Design et Miniature Textiles
    ; les deux premières sont ouvertes aux artistes de l''UE.'
  detection_confidence: 0.75
