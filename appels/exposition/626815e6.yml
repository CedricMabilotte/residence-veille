analyse:
  synthese: 'Le Sentier d''art 2027 appelle des artistes pour créer des œuvres temporaires
    (minimum 2 mètres) du 26 juin au 26 septembre 2027 dans trois communes normandes
    (Brionne, Livet-sur-Authou, Bec-Hellouin), autour du thème « Traversée du temps
    : entre héritage et création contemporaine ». L''enveloppe forfaitaire est de
    2 500 € TTC, supposée couvrir l''intégralité du projet : production, matériaux,
    transport, montage, démontage, médiation et communication. Les candidatures doivent
    être déposées avant le 15 décembre 2026. Les artistes doivent être professionnels
    majeurs, justifier d''une expérience en art environnemental, posséder un SIRET,
    assurer eux-mêmes la logistique technique, et être présents aux jours d''inauguration
    et de médiation (25-26 juin 2027).'
  pour_qui: Artistes professionnels majeurs (France, UE, international sous conditions)
    spécialisés en art environnemental ou sculpture in situ, disposant de moyens techniques
    et logistiques autonomes, et acceptant une rémunération globale très serrée pour
    une création durable trois mois en extérieur.
a_savoir:
- 'Budget très serré (2 500 € TTC pour l''intégralité du projet : production, transport,
  médiation, droits)'
- Rémunération nette potentiellement très faible après déduction des frais réels de
  production et de logistique
- Aucun équipement ni matériel fourni par l'organisme ; artiste en autonomie technique
  complète
- Artiste doit avancer les frais ; dernier versement (500€) après le 27 septembre
- Pas d'assurance de l'œuvre par l'organisme contre vol, dégradation ou intempéries
  ; artiste assume les réparations
- Cession des droits d'exploitation et de reproduction exigée ; durée et étendue à
  clarifier
- Résistance obligatoire aux intempéries pendant trois mois en extérieur
- Dossier technique conséquent requis dès la candidature (photomontages, plans détaillés,
  devis précis)
- Présence obligatoire le 25 juin (médiation) et le 26 juin 2027 (inauguration)
- 'Contraintes patrimoine : soumis à l''avis de l''Architecte des Bâtiments de France
  ; certains sites interdisent percement ou ancrage'
- Artistes ayant participé à l'édition 2026 ne peuvent pas candidater
- Aucune date d'annonce des résultats mentionnée
- Pas de retour prévu aux candidats non retenus
