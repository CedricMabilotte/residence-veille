analyse:
  synthese: Programme Suite 2026 est une exposition collective de 7 artistes soutenus
    par le Centre national des arts plastiques (Cnap), en partenariat avec l'Académie
    des beaux-arts. L'exposition se déploie du 16 mai 2026 au 30 avril 2027 dans 6
    lieux en France et 1 à l'international (Berlin). Le programme vise à donner une
    visibilité publique à des projets ayant bénéficié d'un soutien du Cnap et à irriguer
