analyse:
  synthese: Le Programme Suite 2026 est une exposition collective de sept artistes
    préalablement soutenus par le Centre national des arts plastiques, se déroulant
    de mai 2026 à avril 2027 dans six lieux en France et en Allemagne. Ce programme
    vise à donner une visibilité publique à des projets ayant bénéficié du soutien
    à un projet artistique ou du soutien à la photographie documentaire contemporaine
    du Cnap. Il s'inscrit dans la 12e édition du programme Suite, en partenariat avec
    l'Académie des beaux-arts, et accompagne les artistes dans des réflexions sur
    les modes de production et de fabrication des œuvres.
  pour_qui: Artistes ayant reçu un soutien antérieur du Centre national des arts plastiques
    pour un projet artistique ou pour la photographie documentaire contemporaine.
a_savoir:
- 'Ce n''est pas un appel à candidatures ouvert : les artistes sont présélectionnés
  par les programmes de soutien existants du Cnap.'
- Un lieu du programme se situe en Allemagne (Berlin), les autres en France.
- Les modalités d'accompagnement financier et de prise en charge des frais ne sont
  pas détaillées dans ce contenu.
- Une résidence de création est proposée pour un artiste (Antoine Dochniak) au lieu
  « Semis, lieu de fabrication ».
