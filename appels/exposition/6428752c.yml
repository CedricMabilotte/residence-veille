analyse:
  synthese: Le Programme Suite 2026 est la 12e édition d'un programme du CNAP en partenariat
    avec l'Académie des beaux-arts, présentant 7 projets artistiques ayant bénéficié
    d'un soutien antérieur du CNAP. Ces projets sont exposés dans 6 lieux indépendants
    pilotés par des artistes ou jeunes commissaires, dont 1 à l'international (Berlin).
    Les expositions s'échelonnent du 16 mai au 29 novembre 2026 sur tout le territoire
    français et en Allemagne, dans des espaces tournés vers l'émergence et l'expérimentation.
  pour_qui: Artistes ayant obtenu un soutien du CNAP (soutien à un projet artistique
    ou à la photographie documentaire contemporaine) dont les travaux sont sélectionnés
    pour bénéficier d'une exposition.
