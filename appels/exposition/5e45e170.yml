    une commission de 20% sur toutes les ventes. Entre 10 et 20 pièces par artiste
    sont incluses, les petites œuvres (moins de 50cm x 50cm et moins de £500) pouvant
    aussi être vendues en ligne. Les œuvres doivent être au prix de £2,000 et moins
    et être des œuvres originales (peintures, dessins, sculptures, céramiques, etc.).
