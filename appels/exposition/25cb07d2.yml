analyse:
  synthese: The Horton organise une exposition collective gratuite d'art visuel à
    Epsom, Royaume-Uni, du 17 au 30 juin 2026. Le programme s'adresse aux enfants
    et jeunes de 7 à 18 ans résidant ou scolarisés dans le borough d'Epsom et Ewell.
    Les participants créent des œuvres 2D ou 3D explorant le thème des lieux et espaces
    à Epsom. Les œuvres sélectionnées sont exposées à la galerie de l'atrium du Horton;
    les autres sont affichées sur écran numérique. Les artistes doivent soumettre
    des images numériques entre le 5 et le 22 mai 2026.
