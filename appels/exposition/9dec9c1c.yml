  source_lang: en
  resume_fr: La Glasgow Gallery of Photography (Royaume-Uni) lance un appel à candidatures
    pour une exposition de photographie en noir et blanc qui se tiendra du 1er au
    25 avril 2027. Les photographes peuvent soumettre gratuitement jusqu'à 8 images
    en JPEG (72 ppi), avant le 20 novembre 2026. Si sélectionné, un frais de participation
    de £50 s'ajoute, couvrant l'impression et l'installation des œuvres. Les travaux
    sélectionnés seront exposés en galerie (500 visiteurs/mois en moyenne), promis
    sur les réseaux sociaux (16K followers Instagram) et sur le site web (75K visiteurs/an),
    et les participants recevront un certificat numérique et auront une chance d'être
    nommés « Photographer of the Month » avec publication dans un zine annuel.
