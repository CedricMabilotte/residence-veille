analyse:
  synthese: Monochrome 2027 est un appel à candidature gratuit pour une exposition
    photographique collective annuelle accueillie par la Glasgow Gallery of Photography
    en avril 2027. Ouverte à tous les photographes (émergeants ou établis), la sélection
    implique une participation de 50 £ couvrant l'impression, l'installation et la
    désinstallation. Les œuvres sélectionnées seront exposées pendant un mois en galerie
    physique (500+ visiteurs mensuels en moyenne), en ligne (75K visiteurs annuels)
    et sur les réseaux sociaux (16K followers Instagram). Les artistes sélectionnés
    peuvent concourir pour le titre de Photographer of the Month et figure dans un
    zine de fin d'année.
  pour_qui: Photographes de tous niveaux et toutes origines créant des images en monochrome
    (noir et blanc, cyanotypes, sépia).
a_savoir:
- Frais de participation obligatoire de 50 £ si l'œuvre est sélectionnée
- Les artistes non sélectionnés ne reçoivent pas de notification individuelle
- Les cadres utilisés à l'exposition appartiennent à la galerie et ne sont pas fournis
  aux artistes
- Les artistes doivent récupérer leurs tirages dans le mois suivant la fin de l'exposition
- Aucun critère de sélection explicitement publié au-delà du thème monochrome
