analyse:
  synthese: Pink 2026 est un appel à candidatures pour une exposition photographique
    d'un mois à la Glasgow Gallery of Photography. Les soumissions sont gratuites
    et ouvertes à tous les photographes (amateurs ou professionnels, émergents ou
    établis). Chaque candidat peut soumettre jusqu'à 8 images en JPEG à 72 ppi. Si
    sélectionné, une participation de £48 est demandée, couvrant l'impression, l'installation
    et le désinstallation des œuvres par la galerie. L'exposition se tiendra du 4
    au 30 septembre 2026 à la Glasgow Gallery of Photography qui reçoit plus de 500
    visiteurs mensuels.
  pour_qui: Photographes de tous niveaux (amateurs, professionnels, émergents ou établis)
    intéressés par la thématique 'Pink'.
