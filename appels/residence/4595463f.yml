  resume_fr: 'Casa Ceiba est un programme de résidence artistique basé à Santiago
    Atitlán, destiné aux artistes autochtones, noirs, centraméricains et de la diaspora
    globale. Les résidences durent 4 semaines et incluent le logement, la nourriture,
    l''accès aux studios partagés et aux matériaux. Les coûts estimés varient selon
    la piste sélectionnée : Root et Bloom coûtent 1,150–2,000 USD par semaine, Dream
    coûte 840–900 USD par semaine. Casa Ceiba propose des tarifs variables, des échanges
    de travail et un soutien collaboratif pour améliorer l''accès. La date limite
    de candidature est le 30 novembre 2026.'
