analyse:
  synthese: Casa Ceiba est une résidence culturelle petite échelle et centrée sur
    la guérison à Santiago Atitlán, Guatemala, fondée sur la cosmologie maya et les
    soins collectifs. Elle accueille les artistes, créateurs et praticiens culturels
    autochtones, noirs, centraméricains et en diaspora pour des séjours de 4 semaines
    avec logement partagé, studio équipé, repas et échange culturel avec praticiens
    locaux. Tous les stades de carrière sont acceptés. Les tarifs varient de 840 à
    2 000 USD par semaine selon le track sélectionné; travail d'échange et tarifs
    à l'échelle mobile sont offerts.
  pour_qui: Artistes, créateurs et praticiens culturels autochtones, noirs, centraméricains
    et en diaspora de la majorité mondiale, particulièrement 2Spirit, Indigiqueer,
    queer, trans, femmes et jeunes adultes.
a_savoir:
- Prix élevé (840–2 000 USD par semaine, sans vol inclus) nécessitant une capacité
  financière significative.
- Aucun stipend artistique; les candidats doivent financer leur participation.
- Obligation de conduire un atelier public pour la communauté locale.
- Échange de travail disponible de manière limitée (maximum la moitié du coût de base).
- 'Délai de candidature court: date limite 30 novembre 2026.'
- Critères de sélection du jury non publiés.
