analyse:
  synthese: LAB 5 La mecánica de la verdad est un laboratoire de prototypage collaboratif
    intensif de 2 semaines sélectionnant jusqu'à 5 projets et 20 collaborateurs/as
    multidisciplinaires. Le laboratoire se déroulera du 12 au 25 novembre 2026 à Medialab
    Matadero à Madrid, avec présentation publique du 26 au 28 novembre 2026 au festival
    OpenLAB. Chaque projet bénéficie d'un espace de travail dédié et d'un accompagnement
    par mentors experts, fonctionnant en groupes interdisciplinaires. Le programme
    accueille des créateurs et chercheurs de toute discipline du monde entier. Les
    projets doivent s'inscrire dans la thématique « La mecánica de la verdad » abordant
    la technologie, les représentations alternatives de la réalité et leurs impacts
    démocratiques.
  pour_qui: Personnes majeures de toute discipline et du monde entier intéressées
    par la création collaborative autour de la technologie, de la vérité partagée
