analyse:
  synthese: Le LAB 5 La mecánica de la verdad est un laboratoire de prototypage collaboratif
    de 2 semaines (12-25 novembre 2026) organisé par Medialab Matadero. Le programme
    sélectionne un maximum de 5 projets et 20 collaborateurs pour développer des projets
    expérimentaux explorant la thématique de la mécanique de la vérité. Les équipes
    interdisciplinaires bénéficient d'un espace de travail, du mentorat d'experts
