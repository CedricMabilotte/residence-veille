  resume_fr: Cet appel à candidatures international sélectionne cinq (5) projets et
    jusqu'à vingt (20) collaborateurs/as pour le Laboratoire de Prototipado Colaborativo
    (LPC) du LAB 5 « La mecánica de la verdad » de Medialab Matadero. Le LPC est un
    atelier intensif de deux (2) semaines qui se déroulera de lundi à samedi entre
    le 12 et le 25 novembre 2026, suivi d'une présentation publique entre le 26 et
    le 28 novembre 2026. Les propositions doivent être ouvertes à la participation
    de collaborateurs/as sélectionnés selon leurs compétences et capacité à contribuer
    au développement des projets. L'appel est ouvert aux participants de toute discipline
    et de tout pays du monde.
