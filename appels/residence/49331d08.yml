  resume_fr: LAB 5 est le cinquième laboratoire de recherche collaborative développé
    par Medialab Matadero depuis 2022, consacré au thème « La mécanique de la vérité
    ». Cet appel public international vise à sélectionner un maximum de 5 projets
    expérimentaux et 20 collaborateurs/collaboratrices (jusqu'à 4 par projet) pour
    un atelier intensif de 2 semaines. Le Laboratorio de Prototipado Colaborativo
    se déroulera du 12 au 25 novembre 2026 à Medialab Matadero Madrid, avec une présentation
    publique des projets du 26 au 28 novembre 2026. Une session Q&R en ligne est programmée
    le jeudi 28 mai 2026 à 18h pour les personnes intéressées.
