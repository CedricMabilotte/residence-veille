analyse:
  synthese: Le programme offre une résidence de 3, 6 ou 9 mois à Paris (avril 2027
    – avril 2028) pour des artistes professionnels résidant hors de France depuis
    au moins 5 ans. L'Institut français finance le logement-studio à la Cité internationale
    des arts (18 rue de l'Hôtel de Ville). Les partenaires associés garantissent une
    allocation de résidence minimum de 1100 €/mois, le voyage international, l'assurance
    et les frais de visa. La sélection évalue le parcours professionnel, la qualité
    du projet, le protocole de travail et les contacts dans le milieu artistique français.
    Les candidatures ferment le 8 octobre 2026.
  pour_qui: Artistes et professionnels de la culture établis hors du territoire français,
    engagés dans une démarche professionnelle reconnue et disposant du soutien d'au
    moins un partenaire associé.
