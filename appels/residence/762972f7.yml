analyse:
  synthese: 'Le programme de résidences Institut français x Cité internationale des
    arts propose des séjours de 3, 6 ou 9 mois à Paris pour artistes confirmés résidant
    à l''étranger depuis au moins 5 ans. L''Institut français prend en charge l''hébergement
    en ateliers-logements meublés à la Cité internationale des arts et les partenaires
    versent une allocation minimale de 1100 € par mois, couvrant également le voyage
    international et l''assurance. Sept disciplines artistiques sont éligibles : Architecture,
    Arts Visuels/Photographie, Cinéma, Création numérique, Livre, Métiers d''art/Design,
    Spectacle vivant/Musique. L''appel à candidatures s''étend du 1er juillet au 8
    octobre 2026 pour des résidences entre avril 2027 et avril 2028.'
  pour_qui: Artistes professionnels confirmés résidant à l'étranger depuis au moins
    5 ans, libérés de toute activité professionnelle et souhaitant développer un projet
    de recherche et création à Paris avec le soutien d'au moins un partenaire associé.
a_savoir:
- Candidature obligatoirement soutenue par au moins un partenaire associé qui s'engage
  sur l'allocation mensuelle, le voyage et l'assurance
- Libération complète d'activité professionnelle requise durant toute la durée de
  la résidence
- Maîtrise du français et/ou de l'anglais au niveau professionnel obligatoire
- Les prestations complémentaires (accompagnateur, studios de répétition, ateliers
  collectifs, cours de français) restent à la charge de l'artiste
- Les dates de résidence doivent respecter un calendrier précis en trimestres consécutifs,
  avec possibilité limitée de préférences
