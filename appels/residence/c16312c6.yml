analyse:
  synthese: Résidence de recherche de trois mois à Paris pour artistes visuels dominicains,
    co-organisée par l'Ambassade de la République dominicaine et la Cité internationale
    des arts. Deux sessions proposées en 2027 (janvier-mars et avril-juin). Le programme
    fournit atelier-logement de 20 à 35m², bourse mensuelle de 1000 euros nets, transport
    aérien aller-retour jusqu'à Paris et assurance voyage et santé. Restitution obligatoire
    via open studios et compte rendu détaillé des activités.
  pour_qui: Artistes visuels dominicains ayant au minimum 3 ans d'expérience professionnelle,
    de nationalité dominicaine, résidant en République dominicaine depuis 2 ans, et
    maîtrisant l'anglais ou le français en contexte professionnel.
a_savoir:
- Nationalité dominicaine strictement requise
- Résidence administrative obligatoire en République dominicaine depuis au moins deux
  ans au moment de la candidature
- 'Niveau de carrière : minimum 3 ans d''expérience professionnelle exigés'
- Inéligibilité des artistes ayant déjà bénéficié d'une résidence à la Cité internationale
  des arts
- Engagement de restitution obligatoire et compte rendu détaillé exigé
- 'Accessibilité limitée : ateliers-logements non conformes aux normes actuelles d''accessibilité
  pour personnes en situation de handicap'
