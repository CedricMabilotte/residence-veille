analyse:
  synthese: La Cité internationale des arts, en partenariat avec l'Ambassade de la
    République dominicaine en France et Banco de Reservas, propose 2 résidences de
    3 mois à Paris en 2027 (5 janvier au 26 mars et 2 avril au 28 juin) destinées
    aux artistes visuels dominicains. Les résidents reçoivent un atelier-logement
    de 20-35 m², une bourse mensuelle de 1000 euros nets, la prise en charge du transport
    international et une assurance voyage/santé. Le programme offre un accompagnement,
    une mise en réseau et la possibilité de restituer la recherche via les open studios
    hebdomadaires.
  pour_qui: Artistes visuels de nationalité dominicaine, résidant en République dominicaine
    depuis au moins 2 ans, justifiant au minimum 3 ans d'expérience professionnelle,
    et parlant anglais ou français.
a_savoir:
- Nationalité dominicaine obligatoire et résidence en République dominicaine requise
  depuis au moins 2 ans
- Durée fixe de 3 mois sur deux périodes déterminées
- Frais de passeport, visa et modification de billets non couverts par l'organisme
- Ateliers-logements ne répondent pas aux normes actuelles d'accessibilité pour personnes
  en situation de handicap
- Engagement complet requis pendant toute la résidence et restitution obligatoire
  du processus créatif
- Seules 2 places disponibles au total
