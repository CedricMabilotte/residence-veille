analyse:
  synthese: 'Programme de résidence de 3 mois destiné à 2 artistes visuels de nationalité
    dominicaine, proposé par la Cité internationale des arts en partenariat avec l''Ambassade
    de la République dominicaine et Banco de Reservas. Deux périodes disponibles :
    5 janvier - 26 mars 2027 et 2 avril - 28 juin 2027. Comprend un atelier-logement
    (20-35 m²), une bourse mensuelle de 1 000 euros nets, prise en charge du transport
    international et assurance voyage/santé, accompagnement et mise en réseau. Les
    candidats doivent justifier de 3 ans d''expérience professionnelle minimale, être
    résidents en République dominicaine depuis au moins 2 ans, et maîtriser l''anglais
    ou le français. Date limite : 30 août 2026; résultats annoncés en octobre 2026.'
