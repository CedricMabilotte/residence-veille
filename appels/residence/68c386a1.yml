analyse:
  synthese: 'Dorland Mountain Arts propose des résidences individuelles d''une à six
    semaines en Californie du Sud, dans un cadre naturel protégé. Le programme accueille
    des artistes de tous niveaux de carrière et de toutes disciplines (arts visuels,
    littérature, musique, etc.). Les cottages individuels incluent logement, cuisine,
    salle de bain et espace de travail; studios spécialisés (atelier d''impression,
    studio de peinture, bibliothèque) sont accessibles. Les frais de résidence sont
    450-675 USD par semaine avec réductions pour 4 semaines ou plus. Frais de dossier
    : 40 USD. Aucune rémunération, aide au voyage ou support financier mentionnés.
    Date limite : 24 novembre 2026.'
  pour_qui: Artistes visuels, écrivain·es, musicien·nes et compositeur·rices de tous
    niveaux de carrière et nationalités cherchant une résidence créative protégée
    en Californie du Sud avec accès à studios équipés.
