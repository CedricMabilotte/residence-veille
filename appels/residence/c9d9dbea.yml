analyse:
  synthese: La Maison nationale des artistes est un EHPAD fondé en 1945 qui accueille
    prioritairement des artistes en fin de vie, proposant logement et activités culturelles.
    La Fondation des Artistes finance chaque année une résidence artistique permettant
    la création collective d'une œuvre, d'une exposition ou d'une représentation.
    L'établissement met à disposition une Académie de peinture et de dessin, des pianos
    pour les musiciens et des ateliers d'écriture. Un programme culturel quotidien
    associe expositions monographiques ou collectives, concerts, lectures, conférences
    et projections. L'accès est sans condition de revenus pour les artistes et écrivains
    ainsi que pour les habitants du Val-de-Marne confrontés à des problèmes de dépendance.
  pour_qui: Artistes et écrivains en fin de vie, prioritairement, ainsi que des habitants
    du Val-de-Marne souhaitant se retirer ou confrontés à des problèmes de dépendance.
