analyse:
  synthese: Les Factotum proposent une résidence de recherche et de création d'un
    mois à Nantes de mai à juillet 2027, destinée aux artistes plasticien·nes professionnelles
    avec pratique confirmée. Le programme allie art contemporain et savoir-faire artisanaux
    via collaboration obligatoire avec les artisan·es de l'Atelier Petite Métallerie,
    avec accompagnement artistique et technique. L'artiste reçoit une bourse de 2
    500 € (incluant droits d'exposition), un budget production de 1 500 €, un hébergement
    et un atelier de 20 m². L'exposition est intégrée à la Biennale Wave à l'automne
    2027. Candidatures avant le 1er décembre 2026.
  pour_qui: Artistes plasticien·nes professionnelles avec une pratique artistique
    confirmée et des expériences antérieures significatives, souhaitant développer
    un projet expérimental en collaboration directe avec des artisan·es du métal ou
    des disciplines complémentaires de l'Atelier Petite Métallerie.
