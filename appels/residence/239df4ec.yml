analyse:
  synthese: 'KIAR Textile India Residency propose une immersion textile à Bhubaneswar
    en trois durées au choix : 15 jours (850 USD), 30 jours (1500 USD) ou jusqu''à
    3 mois (4000 USD). Chaque séjour inclut hébergement, atelier, accès aux repas,
    et guidance culturelle. Les résidents explorent directement les traditions textiles
    vivantes (ikat, sambalpuri, khandua, tussar, kotpad) via studio practice, visites
    de sites textiles et rencontres avec artisans locaux, dans une région reconnue
    pour 64 catégories d''artisanat traditionnel. Des opportunités de présentation
    ou exposition sont possibles pour les séjours de 30 jours minimum.'
