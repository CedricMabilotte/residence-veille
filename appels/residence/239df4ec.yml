  resume_fr: La Résidence textile Inde KIAR est un programme immersif pour designers
    textiles, designers de mode et artistes basé à Bhubaneswar, Odisha, qui offre
    une culture textile vivante avec 64 catégories d'artisanat. Les participants étudient
    des traditions textiles distinctes comme l'Ikat, le Sambalpuri, le Khandua et
    le Bomkai à travers la recherche, l'immersion culturelle et l'interaction avec
    les artisans. Odisha est présentée comme un laboratoire textile vivant plutôt
    qu'une simple archive, avec une histoire remontant à l'époque antique de Kalinga,
    visitée au 7ème siècle par le voyageur bouddhiste Xuanzang.
