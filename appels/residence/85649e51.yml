analyse:
  synthese: La Porte Peinte est un centre international d'arts résidentiels basé dans
    le village médiéval de Noyers sur Serein (Bourgogne, France), ouvert depuis 2011.
    Elle propose des résidences de 6 mois pour artistes, créateurs, musiciens et écrivains
    de tous niveaux de carrière, sans restriction de nationalité. Chaque artiste accède
    à un studio privé, un hébergement (chambre privée ou logement individuel), accès
    à atelier collectif équipé, galerie et espaces de performance. Les frais mensuels
    varient de 2000 à 3300 EUR selon la chambre, incluant tous services ; aucun stipend
    n'est offert. Un nombre limité de places partiellement ou entièrement financées
    sont disponibles pour les artistes en situation économique ou de vulnérabilité.
  pour_qui: Artistes, créateurs, musiciens, écrivains et cinéastes de tous niveaux
    de carrière (émergent·e, confirmé·e, établi·e) du monde entier ; groupes collaboratifs
    et familles acceptés.
a_savoir:
- 'Résidence à financement propre : frais importants (€2000–€3300 par mois selon chambre)'
- Aucune rémunération ou stipend d'artiste ; aucune prise en charge de frais de voyage
  ou production
- Places financées très limitées et ciblées (artistes affectés par la guerre, catastrophe
  naturelle, discriminations, focus sur femmes et artistes émergents du continent
  africain, Haïti, Amérique latine)
- Dossier en anglais et/ou français requis
- Calendrier de notification des résultats non communiqué
- Attente d'une présentation ou artist talk en sus de la production personnelle
