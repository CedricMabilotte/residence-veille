analyse:
  synthese: Ce programme de résidence de 3 mois à Paris, créé en 2025, est une collaboration
    entre la Cité Internationale des Arts et la Faculté d'art et de design de l'Université
    Jan Evangelista Purkyně en République tchèque. Il s'adresse aux artistes visuels
    et commissaires d'exposition d'art contemporain (doctorants, diplômés depuis maximum
    10 ans, ou enseignants actuels) ayant développé au minimum 5 ans de pratique artistique
    ou curatoriale professionnelle, issus de l'écosystème académique de la FUD UJEP.
    Le programme offre un financement complet incluant l'hébergement, un espace de
    création, et un accompagnement professionnel avec opportunités de mise en réseau.
    Seulement 2 résidences sont disponibles par année. L'appel à candidature pour
    ce programme est actuellement fermé (passé).
  pour_qui: Artistes visuels ou commissaires d'exposition d'art contemporain de la
