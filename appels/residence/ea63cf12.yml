  resume_fr: Matadero Madrid et la Cinémathèque offrent trois (3) résidences de deux
    mois, du 1er octobre au 30 novembre 2026, pour des projets audiovisuels en phase
    de développement. Destinées aux créateurs audiovisuels indépendants résidant dans
    la Communauté de Madrid, ces résidences soutiennent les projets de cinéma indépendant,
    expérimental et documentaire. Les résidences incluent un accompagnement curatorial,
    des ressources spatiales et économiques pour faciliter le développement des projets
    incipients. L'objectif est de renforcer le tissu créatif audiovisuel indépendant
    et d'établir des connexions entre les professionnels et le public.
