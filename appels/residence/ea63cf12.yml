  resume_fr: Matadero Madrid et Cineteca Madrid lancent un appel à candidatures pour
    l'attribution de trois (3) résidences de deux mois, destinées aux créateurs audiovisuels
    indépendants résidant dans la Communidad de Madrid. Les résidences se dérouleront
    du 1 octobre au 30 novembre 2026 et concernent les projets audiovisuels en phase
    initiale de recherche, développement ou écriture, axés sur le cinéma indépendant,
    expérimental et le cinéma du réel. L'objectif est de soutenir le développement
    professionnel du secteur audiovisuel indépendant en fournissant des ressources
    spatiales, économiques et un accompagnement curatorial et de production.
