  resume_fr: Matadero Madrid et Cineteca Madrid lancent un appel conjoint pour l'attribution
    de trois résidences destinées à des projets audiovisuels. Les résidences, d'une
    durée de deux mois (du 1er octobre au 30 novembre 2026), sont destinées à des
    créateurs audiovisuels résidents de la Communauté de Madrid dont les projets sont
    en phase initiale de recherche, développement ou écriture. Elles soutiennent le
    cinéma indépendant, expérimental et le cinéma du réel. Les résidences offrent
    un accompagnement institutionnel ainsi que des ressources spatiales et économiques
    pour le développement des projets.
