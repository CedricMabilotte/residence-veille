analyse:
  synthese: Convocatoria de tres (3) residencias de dos meses (1 de octubre - 30 de
    noviembre 2026) para creadores audiovisuales independientes en fase inicial de
    investigación, desarrollo o escritura de proyectos. Matadero Madrid proporciona
    espacios de producción, acompañamiento curatorial y de producción para apoyar
    la creación cinematográfica independiente, experimental y documental. Dirigida
    a residentes de la Comunidad de Madrid, de nacionalidad española, UE o con residencia
