analyse:
  synthese: Programme de résidence artistique pour la création d'une sculpture monumentale
    participative dans le parc du Centre Psychothérapique de l'Ain à Bourg-en-Bresse,
    s'inscrivant dans le dispositif Culture NoMad depuis 2009. S'adresse aux artistes
    plasticiens et sculpteurs professionnels. Dotation de 8 000 € TTC couvrant honoraires,
    matériaux, production, animation d'ateliers participatifs et installation. La
    réalisation est prévue au premier semestre 2027 avec inauguration début juin dans
    le cadre de « Rendez-vous aux Jardins ». Une salle d'atelier est fournie ; des
    ateliers de co-création avec patients, soignants et habitants sont organisés sous
    la conduite de l'artiste autour de la thématique imposée « La fabrique des récits
    ».
  pour_qui: Artistes plasticiens ou sculpteurs professionnels intéressés par les projets
    participatifs et les créations monumentales en site-spécifique, particulièrement
    ceux engagés dans une démarche collaborative en milieu hospitalier.
a_savoir:
- 'Dotation très modeste (8 000 € pour l''ensemble : honoraires, matériaux, production,
  ateliers) pour une sculpture monumentale avec durée de vie minimale de 5 ans.'
- 'Calendrier imposé et serré : réalisation au premier semestre 2027 pour un projet
  d''envergure monumentale.'
- 'Thématique et processus très prescriptifs : création participative obligatoire
  avec patients et habitants constituant un élément central du projet.'
- Aucun délai de notification annoncé pour les candidat·es non retenu·es ; critères
