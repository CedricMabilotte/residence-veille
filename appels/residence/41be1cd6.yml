analyse:
  synthese: Le CPA lance un appel à projet pour concevoir et réaliser une sculpture
    monumentale participative, quatrième œuvre du parcours 'Chemin des Arts'. L'artiste
    retenu travaille en co-création avec patients, soignants et habitants autour de
    la thématique 'La fabrique des récits'. Une salle d'atelier et ressources techniques
    sont mises à disposition. La dotation s'élève à 8 000 € TTC couvrant honoraires,
    matériaux, production, animation des ateliers et déplacement/hébergement. La réalisation
    est prévue au premier semestre 2027, avec inauguration publique en juin 2027.
  pour_qui: Artistes plasticiens et sculpteurs professionnels intéressés par la création
    participative et les projets culturels en contexte hospitalier favorisant l'ouverture
    sur le territoire.
