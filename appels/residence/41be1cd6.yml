analyse:
  synthese: Ce programme invite les artistes plasticiens et sculpteurs professionnels
    à concevoir une sculpture monumentale participative pour le parc du Centre Psychothérapique
    de l'Ain. L'enveloppe attribuée s'élève à 8 000 € TTC, couvrant honoraires, matériaux,
    production, animation des ateliers et frais de déplacement/hébergement. La réalisation
    est prévue au premier semestre 2027, avec une inauguration début juin 2027 lors
    de l'événement 'Rendez-vous aux Jardins'. Le projet doit intégrer une dimension
    participative forte, associant patients, professionnels de l'hôpital et habitants
    à la co-création. Une salle d'atelier et des ressources techniques du site sont
    mises à disposition.
  pour_qui: Artistes plasticiens et sculpteurs professionnels ayant une expérience
    de co-création et intéressés par des projets participatifs en contexte hospitalier.
a_savoir:
- 'Calendrier très serré : date limite 8 septembre 2026, réalisation au premier semestre
  2027.'
- Enveloppe globale de 8 000 € TTC pour tous les postes (honoraires, matériaux, production,
  ateliers, installation, déplacement, hébergement) — budget potentiellement restrictif
  pour une œuvre monumentale.
- Forte implication requise en animation d'ateliers de co-création avec publics diversifiés
  et hospitaliers.
- Œuvre en extérieur avec durabilité minimale de 5 ans — expertise en matériaux pérennes
  et résistance aux conditions climatiques requise.
