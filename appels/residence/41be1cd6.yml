analyse:
  synthese: Le Centre Psychothérapique de l'Ain lance un appel à projet destiné aux
    artistes plasticiens et sculpteurs professionnels pour concevoir la quatrième
    sculpture monumentale du « Chemin des Arts », parcours ouvert dans son parc. L'œuvre
    doit être développée en co-création avec les patients, professionnels de l'hôpital
    et habitants, autour de la thématique « La fabrique des récits ». Une dotation
    forfaitaire de 8 000 € TTC couvre les honoraires, matériaux, production, ateliers
    participatifs, installation et éventuels frais de déplacement et hébergement.
    La réalisation est prévue au premier semestre 2027, avec inauguration en juin
    2027 lors de l'événement national « Rendez-vous aux Jardins ».
  pour_qui: Artistes plasticiens et sculpteurs professionnels intéressés par la création
    participative, la rencontre avec des publics diversifiés et les projets impliquant
    une dimension sociale ou thérapeutique.
a_savoir:
- 'Dotation de 8 000 € couvrant tous les frais (honoraires, matériaux, production,
  ateliers, installation) : enveloppe unique à répartir.'
- 'Thématique imposée (« La fabrique des récits ») : pas de liberté de sujet.'
- 'Participation et co-création obligatoires avec les patients et habitants : temps
  limité à la production libre.'
- 'Calendrier fixe (premier semestre 2027) : pas de flexibilité de dates.'
- 'Restitution majeure et publique : l''œuvre s''installe en extérieur dans le parc
  et inauguration nationale.'
