analyse:
  synthese: 'Medialab Matadero lance la cinquième édition de son programme de résidences
    de recherche située pour 2027. Le programme sélectionnera 3 projets explorant
    l''intersection entre art contemporain, design, science, technologie et société,
    dotés de 10 000 € chacun (hors impôts). Les résidents disposent de l''infrastructure
    du Medialab Matadero incluant Fablab et espace de travail individuel. La résidence
    s''étend de janvier à juillet 2027 et exige une restitution publique significative
    : activités ouvertes (séminaires, ateliers), publications et documentations. Les
    candidatures sont acceptées jusqu''au 27 septembre 2026 en espagnol ou anglais.'
  pour_qui: Artistes, designers, architectes, urbanistes, scientifiques, ingénieurs,
    journalistes, programmeurs et professionnels d'autres domaines afins meneurs de
    recherche transdisciplinaire innovante et collaborative, tous niveaux de carrière
    confondus (profils émergents et confirmés).
a_savoir:
- Résidence de 7 mois en régime de présence obligatoire, avec recommandation d'une
  présence importante entre mars et juin.
- 'Restitution publique significative : activités publiques obligatoires (séminaires,
  ateliers, conversatorios) et production de matériaux documentaux requis.'
- Pas d'hébergement mentionné dans la convocatoire.
- 'Les propositions doivent se connecter explicitement avec un ou plusieurs des thèmes
  spécifiques de Medialab : Medios Sintientes, El Sublime Metabólico, Mentes Sintéticas,
  Futuros Raros, La Mecánica de la Verdad.'
