analyse:
  synthese: La Fondation des Artistes gère un programme permanent d'attribution d'ateliers
    et d'ateliers-logements aux artistes plasticiens en activité. Le parc comprend
    91 ateliers répartis entre Nogent-sur-Marne (36 ateliers du Hameau, 35 ateliers-logements
    de la Cité Guy-Loë) et Paris (4 ateliers de l'Impasse Savart, 16 ateliers-logements
    du Faubourg Poissonnière). L'attribution se fait sans critère d'âge ni de nationalité
    sur présentation d'un dossier artistique et administratif. L'obtention d'un atelier
    s'accompagne de la signature d'un bail fixant un loyer mensuel.
  pour_qui: Artistes plasticiens en activité justifiant de leur appartenance au régime
    social des artistes.
a_savoir:
- Programme permanent sans date limite de candidature fixe
- Aucune rémunération, bourse ou aide financière proposée
- Attribution dépendante de la disponibilité d'ateliers vacants
- Loyer mensuel obligatoire à payer après attribution
- Hébergement fourni uniquement avec certains ateliers-logements, pas avec tous les
  ateliers
