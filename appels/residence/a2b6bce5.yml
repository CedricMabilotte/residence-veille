analyse:
  synthese: La Fondation des Artistes gère un parc de 91 ateliers et ateliers-logements
    répartis à Paris et Nogent-sur-Marne depuis 1976. Le programme s'adresse à des
    artistes plasticiens en activité justifiant de l'appartenance au régime social
    des artistes, sans critère d'âge ni de nationalité. L'attribution se fait par
    dossier artistique et administratif, examinés par une commission lors de la vacance
    d'un atelier. Un bail fixe le loyer mensuel.
  pour_qui: Artistes plasticiens en activité, affiliés au régime social des artistes,
    en recherche d'espace de travail pérenne.
