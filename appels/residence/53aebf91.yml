  resume_fr: 'Matadero Madrid (Centre de créations contemporaines) lance un appel
    à candidatures pour une résidence artistique destinée aux créateurs et collectifs
    de la Communauté de Madrid travaillant dans l''art et l''éducation. Les inscriptions
    sont ouvertes jusqu''au 27 avril à 14h. La résidence propose deux axes de recherche
    : la médiation autour des urgences contemporaines (dissidences du corps, activisme
    antirraciste, urgence climatique, transformations du travail, santé mentale),
    ou la recherche sur la médiation et les croisements entre art et éducation. Une
    séance informative en ligne aura lieu le 19 mars de 11h à 12h. Le projet retenu
    mènera un processus de réflexion et un programme de médiation intégré aux installations
    de Matadero Madrid.'
