  resume_fr: 'Matadero Madrid lance la VIe convocation de résidences artistiques pour
    attribuer une (1) résidence en art et éducation, d''une durée de 9 mois, du 1er
    octobre 2026 au 30 juin 2027. Les projets doivent s''inscrire dans une démarche
    de recherche et de médiation autour de deux axes possibles : les émergences contemporaines
    (dissidences du corps, activisme antiraciste, urgence climatique, transformations
    du travail, santé mentale) et/ou la recherche sur la médiation et les croisements
    entre art et éducation. Les propositions doivent faire preuve d''un caractère
    expérimental et cohérent avec la trajectoire du candidat, et sont écartées si
    elles visent exclusivement la médiation d''expositions ou le travail en centres
    éducatifs.'
