  resume_fr: 'Matadero Madrid ouvre 1 résidence artistique de 9 mois (1er octobre
    2026 - 30 juin 2027) destinée à un créateur, collectif ou agent culturel travaillant
    sur l''art et l''éducation. Deux lignes de recherche sont proposées : l''une abordant
    les enjeux contemporains (dissidences corporelles/affectivo-sexuelles, activismes
    antirracistes, urgence climatique, transformations productivistes du travail,
    santé mentale) par la médiation et l''art-éducation, l''autre portant sur la médiation
    elle-même et ses croisements avec l''art-éducation. Les projets à caractère expérimental
    sont favorisés. Sont exclus les projets limités à la médiation d''expositions,
    au travail avec des établissements éducatifs, aux arts de la scène ou à la création
    cinématographique.'
