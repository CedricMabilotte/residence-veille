  resume_fr: 'Madrid Destino organise un appel à candidatures pour une (1) résidence
    au Centre de Résidences Artistiques de Matadero Madrid, destinée à des créateurs,
    collectifs ou agents culturels travaillant sur l''art et l''éducation. La résidence
    dure 9 mois, du 1er octobre 2026 au 30 juin 2027. Les projets doivent s''inscrire
    dans l''une de deux lignes de recherche : aborder les urgences contemporaines
    ou développer une recherche sur la médiation et les croisements entre l''art et
    l''éducation. Les projets expérimentaux sont valorisés ; sont exclus ceux exclusivement
    consacrés à la médiation d''expositions, au travail avec des centres éducatifs,
    ou aux arts de la scène et création cinématographique.'
