  resume_fr: 'Madrid Destino lance un appel à candidatures pour l''attribution d''une
    (1) résidence au Centre de résidences artistiques de Matadero Madrid, destinée
    à des créateurs, collectifs ou agents culturels travaillant en art et éducation.
    La résidence dure 9 mois, du 1er octobre 2026 au 30 juin 2027, et combine recherche,
    médiation et création dans les locaux du centre. Deux lignes de recherche sont
    proposées : les émergences contemporaines (disidences, activisme antirraciste,
    crise climatique, santé mentale, etc.) ou la médiation et les croisements art-éducation.
    Les projets doivent être innovants et cohérents avec le parcours du candidat,
    excluant la simple médiation d''expositions ou le travail scolaire traditionnel.'
