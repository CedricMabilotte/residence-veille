  resume_fr: 'Matadero Madrid lance une résidence de 9 mois, du 1er octobre 2026 au
    30 juin 2027, pour une (1) résidence en art et éducation, ouverte aux créateurs,
    collectifs et agents culturels. Les projets doivent être cohérents avec la trajectoire
    du candidat et contribuer aux discours actuels de la médiation, l''art et l''éducation,
    avec une valorisation des approches expérimentales. Deux axes de recherche sont
    possibles: réflexion sur les urgences contemporaines (dissidences du corps, activisme
    antirraciste, urgence climatique, santé mentale) ou recherche sur la médiation
    et les croisements entre art et éducation. Sont exclus les projets destinés exclusivement
    à la médiation d''expositions, au travail avec centres éducatifs, aux arts scéniques
    ou à la création cinématographique.'
