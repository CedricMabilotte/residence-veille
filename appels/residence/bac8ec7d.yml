analyse:
  synthese: La Ville de Questembert lance un appel à projets artistiques pour une
    installation participative et temporaire dans l'espace public en 2027. Budget
    maximal de 8500 €, couvrant honoraires, production, déplacements et médiation.
    L'artiste doit intégrer les habitants du quartier des Halles au processus créatif,
    privilégier matériaux durables et réemploi. Disponibilité requise mai-juin 2027
    pour résidence et actions participatives, puis septembre 2027 pour démontage.
    Hébergement et atelier fournis.
  pour_qui: Artistes plasticiens ou visuels professionnels (individuels ou collectifs)
    et étudiants en art soucieux de création participative et de transformation urbaine
    inclusive.
