    Ghetto historique de Venise, accueillant artistes visuels, écrivains et chercheurs.
    Les séjours durent de 2 à 6 semaines, avec un coût de 1 200€ par semaine pour
    l'artiste (Venezia Contemporanea couvrant 50% des 2 400€ par semaine). L'espace
    inclut studio, galerie, fournitures d'art de base et soutien curatorial léger,
    mais exclut vols et frais de voyage. Les candidatures sont ouvertes toute l'année
    sans date limite.
