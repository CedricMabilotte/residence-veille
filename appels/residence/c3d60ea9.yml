analyse:
  synthese: La Storta offers a 2-6 week residency in Venice's historic Ghetto, in
    a 500-year-old Renaissance building. Venezia Contemporanea covers 50% of €2,400
    per week; artists contribute €1,200 per week. Includes live-in studio, street-level
    gallery with vitrine window, basic art supplies, two projectors, and light curatorial
    support. Applications accepted year-round on rolling basis. Flights, travel, per
    diem, and additional art supplies not covered.
  pour_qui: Visual artists, writers, and researchers of all career levels seeking
    to live, create, and exhibit in central Venice with partial cost-sharing.
a_savoir:
- Artist must cover 50% of €2,400 weekly costs (€1,200/week minimum)
- Travel, flights, per diem, and additional art supplies not covered
- Resident cat Campari present—unsuitable for those with cat allergies
- Minimum 2-week commitment required
- Exhibition limited to local La Storta gallery; no visibility guarantee beyond organization
- No jury criteria or selection transparency provided
- Tension between 'rolling basis' claims and application deadline of 2026-08-06
