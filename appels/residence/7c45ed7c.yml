analyse:
  synthese: La Maldita Estampa propose une résidence de 2 mois à Barcelone pour développer
    des projets en gravure et techniques graphiques traditionnelles et contemporaines.
    Le programme accueille 5 artistes simultanément dans un atelier équipé, sans restriction
    de nationalité ni de niveau de carrière. Les artistes participent à des présentations
