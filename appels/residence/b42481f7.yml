analyse:
  synthese: Le Château de Bonaban lance un appel à commande pour la création d'une
    œuvre contemporaine pérenne destinée à son parc de 25 hectares. Trois artistes
    plasticiens ou designers professionnels seront présélectionnés et rémunérés 1
    000 € TTC chacun pour développer leur proposition. Une enveloppe de 30 000 € TTC
    couvre les honoraires et frais de réalisation des projets retenus. L'œuvre devra
    dialoguer avec le paysage, l'architecture et la collection du domaine (plus de
    1 500 pièces). Les candidatures sont reçues jusqu'au 30 novembre 2026 à 9 h, avec
    livraison finale attendue le 30 avril 2027.
  pour_qui: Artistes plasticiens et designers professionnels dont la carrière est
    établie (expositions, réalisations, acquisitions en collection ou commandes),
    capables de concevoir une œuvre pérenne dialoguant avec un site extérieur et ses
    spécificités architecturales et patrimoniales.
a_savoir:
- 'Niveau professionnel très élevé exigé : carrière établie et références déterminantes
  pour la sélection.'
- 'Budget partagé : si plusieurs projets sont retenus, les 30 000 € TTC seront divisés
  entre eux.'
- Les 30 000 € TTC incluent honoraires, matériaux, fabrication, transport et installation
  — ce n'est pas une rémunération artistique nette.
- Frais de transport et de séjour des trois présélectionnés ne sont pas remboursés
  séparément.
- 'Calendrier très serré : présélection 7 décembre, visite 15 décembre, remise des
  projets 15 janvier, livraison 30 avril.'
- 'Dossier sans esquisse à ce stade : uniquement CV, visuels et note d''intention.'
