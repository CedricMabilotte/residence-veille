analyse:
  synthese: Ce programme offre une résidence artistique auto-dirigée en Colombie pour
    mai 2027. Les artistes de toutes disciplines reçoivent un logement privé, trois
    repas végétariens quotidiens et accès à plusieurs espaces de travail (studios
    partagés et salles privées). Les frais de participation sont 1095 USD (chambre
    arrière) ou 1195 USD (chambre avant) par mois pour une durée de 1 à 3 mois. Les
