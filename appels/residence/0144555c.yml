analyse:
  synthese: Ce document est une charte établissant les standards communs pour les
    programmes de résidence du réseau culturel français à l'étranger. Il définit qu'une
    résidence doit offrir un logement, un espace de travail, une durée minimale d'un
    mois, une allocation à l'artiste, et un support administratif et artistique. Les
    résidences ciblent les artistes français ou établis professionnellement en France,
    mais peuvent accueillir aussi les artistes locaux et internationaux pour favoriser
    la collaboration.
  pour_qui: Artistes français ou professionnellement établis en France de toutes disciplines
