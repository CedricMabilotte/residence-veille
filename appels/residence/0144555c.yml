  extracted_by: claude-haiku-4-5
  extracted_at: '2026-05-21T10:49:15+00:00'
  source_lang: en
  resume_fr: Cette charte établit un cadre commun et des normes pour les programmes
    de résidences du réseau culturel français à l'étranger, élaborée par l'Institut
    français, le Ministère de l'Europe et des Affaires étrangères et le Ministère
    de la Culture. Une résidence se définit par la fourniture d'un logement et d'un
    espace de travail, une durée minimale de 1 mois, un soutien administratif et artistique,
    et l'attribution d'une bourse à l'artiste. Au moins 70% du temps de résidence
    doit être consacré au projet de l'artiste. Ces programmes s'adressent aux artistes
    français ou établis professionnellement en France, mais peuvent aussi accueillir
    des artistes locaux ou d'autres pays. Les résidences se concentrent sur la création,
    la recherche ou l'expérimentation.
