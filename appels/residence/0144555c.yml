  resume_fr: Cette charte, établie par l'Institut français, le Ministère de l'Europe
    et des Affaires étrangères et le Ministère de la Culture, définit un cadre commun
    pour les programmes de résidences du réseau culturel français à l'étranger, s'appuyant
    sur la circulaire du 8 juin 2016 et la direction ministérielle du 12 janvier 2023.
    Une résidence doit offrir un logement et un espace de travail, avoir une durée
    minimale d'un mois, fournir un soutien administratif et artistique, avec au moins
    70% du temps dédié au projet artistique, et inclure une bourse. Les résidences
    ciblent la création, la recherche ou l'expérimentation, et s'adressent aux artistes
    français ou établis en France, avec possibilité d'accueillir des artistes locaux
    ou étrangers.
