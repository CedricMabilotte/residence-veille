  resume_fr: Cette charte établit un cadre commun et des standards pour les programmes
    de résidence gérés par le réseau culturel français à l'étranger. Elle est basée
    sur la circulaire du ministère de la Culture du 8 juin 2016 et la direction ministérielle
    n° DSS/5B/DGCA/2023/6 du 12 janvier 2023. Une résidence comprend un logement et
    un espace de travail, une durée minimale d'un mois, un support administratif et
    artistique, au minimum 70 % du temps consacré au projet de l'artiste, et une allocation.
    Les programmes ciblent la création, la recherche ou l'expérimentation et s'adressent
    aux artistes français ou établis professionnellement en France, tout en pouvant
    être ouverts aux artistes locaux ou étrangers pour favoriser la collaboration.
