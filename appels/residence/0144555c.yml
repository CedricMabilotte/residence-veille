  resume_fr: Cette charte, établie par l'Institut français, le Ministère de l'Europe
    et des Affaires étrangères, et le Ministère de la Culture, définit un cadre commun
    et des normes pour les programmes de résidence du réseau culturel français à l'étranger.
    Une résidence doit comprendre un logement et un espace de travail, une durée minimale
    d'un mois, un soutien administratif et artistique, et au minimum 70% du temps
    consacré au projet de l'artiste, avec allocation de résidence. Ces programmes
    ciblent principalement la création, la recherche ou l'expérimentation, et s'adressent
    aux artistes français ou professionnellement établis en France, tout en pouvant
    accueillir des artistes locaux ou d'autres pays pour favoriser la collaboration.
