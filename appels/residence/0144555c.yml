  resume_fr: Cette charte, établie par l'Institut français et le Ministère des Affaires
    étrangères avec le Ministère de la Culture, fixe le cadre commun pour les programmes
    de résidence du réseau culturel français à l'étranger. Une résidence comprend
    un logement, un espace de travail, une durée minimale d'un mois, un soutien administratif
    et artistique, et une allocation. Au minimum 70% du temps de résidence doit être
    consacré au projet de l'artiste. Ces programmes visent la création, la recherche
    ou l'expérimentation et s'adressent aux artistes français ou établis professionnellement
    en France.
