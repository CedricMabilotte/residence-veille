analyse:
  synthese: 'Ce document établit les standards et cadres normatifs pour les programmes
    de résidence gérés par le réseau culturel français à l''étranger. Une résidence
    est définie par : logement et espace de travail fournis, durée minimum d''un mois,
    soutien administratif/technique/artistique, au moins 70% du temps dédié au projet
    de l''artiste, et une allocation ou bourse accordée à l''artiste. Les programmes
    s''adressent à des artistes français ou établis professionnellement en France,
    pouvant aussi accueillir des artistes locaux pour favoriser la collaboration.
    Ce ne sont pas des appels à candidatures spécifiques, mais des lignes directrices
    transversales.'
