analyse:
  synthese: 'Ce document est une charte établissant les standards communs pour les
    programmes de résidences artistiques du réseau culturel français à l''étranger.
    Il s''adresse aux postes diplomatiques (ambassades, instituts français, etc.)
    et définit les critères pour les artistes. Les conditions principales incluent:
    un minimum de un mois de durée, la fourniture d''un logement et d''un espace de
    travail, une bourse de résidence, un soutien administratif et artistique, et au
    moins 70% du temps dédié au projet artistique.'
  pour_qui: 'Artistes français ou professionnellement établis en France, ainsi que
    les artistes locaux et internationaux, dans les disciplines suivantes: arts visuels,
    littérature, théâtre, musique, danse, audiovisuel, cinéma, photographie, commissariat
    d''exposition, traduction littéraire, et métiers d''art.'
a_savoir:
- Ceci est un document-cadre (charte), non un appel à candidature spécifique; pas
  de date limite, pas de détails pratiques d'application
- Les résidences ne sont pas destinées aux programmes de distribution, circulation,
  formations ou commandes artistiques
- Les artistes doivent être français ou professionnellement établis en France; les
  artistes locaux et internationaux peuvent également postuler, pour encourager la
  collaboration
- 'Durée minimale requise: un mois'
- Au moins 70% du temps dédié au projet de l'artiste
