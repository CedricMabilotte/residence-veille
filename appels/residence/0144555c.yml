  resume_fr: La charte a été élaborée par l'Institut français, le Ministère de l'Europe
    et des Affaires étrangères et le Ministère de la Culture pour établir un cadre
    commun pour les programmes de résidences du réseau culturel français à l'étranger.
    Une résidance doit offrir logement et espace de travail pour une durée minimale
    d'un mois, avec au minimum 70% du temps consacré au projet artistique. Les programmes
    ciblent les artistes français ou établis professionnellement en France et se concentrent
    sur la création, la recherche ou l'expérimentation, non la distribution ou la
    formation.
