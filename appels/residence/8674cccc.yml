  resume_fr: 'Le Palimpsest Project propose une résidence murale à Buenos Aires où
    les artistes créent des fresques en dialoguant avec les œuvres existantes. La
    résidence dure 7 jours de travail plus 12 jours de séjour en ville, s''adresse
    aux artistes visuels en groupes de jusqu''à 2 personnes, avec inscription gratuite
    et candidatures ouvertes toute l''année. Deux formats sont disponibles : résidences
    d''exploration (4 semaines) et micro-résidences (2 semaines, 10 jours de travail).
    Les résidences encouragent la collaboration avec d''autres résidents et artistes
    locaux, notamment dans les festivals de peinture murale et les espaces publics
    de Buenos Aires.'
