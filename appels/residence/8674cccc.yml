analyse:
  synthese: The Palimpsest Project is a mural painting residency in Buenos Aires for
    emerging or career visual artists interested in muralism and/or urban art. Artists
    work on a shared terrace creating murals by dialoguing, intervening, or overlapping
    with previous works. Registration is free and applications are ongoing year-round.
    The residency comprises 7 working days of creation plus 12 days total stay in
    the city, with opportunities to collaborate with other residents and participate
    in mural festivals in Buenos Aires.
  pour_qui: Emerging or career visual artists with interest in mural painting and/or
    urban art, working individually or in groups of up to 2 members.
