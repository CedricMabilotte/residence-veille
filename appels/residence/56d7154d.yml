  resume_fr: 'Le 12 de mayo 2026, Madrid Destino Cultura Turismo y Negocio annonce
    les résultats de la III Convocatoria pour l''attribution de 8 résidences trimestrielles
    de production artistique sur l''environnement destinées à des artistes visuels.
    La Commission de valorisation, réunie le 08 de mayo 2026, a sélectionné les candidats
    parmi 86 candidatures reçues. Les 8 résidences sont réparties en deux catégories
    : 5 artistes résidents dans la Communauté de Madrid (plus 2 suppléants) et 3 artistes
    résidents en Espagne (plus 2 suppléants), chacun porteur d''un projet d''art visuel.'
