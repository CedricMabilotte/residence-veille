  resume_fr: Programme de résidence multidisciplinaire du 15 avril au 6 mai 2027 (3
    semaines / 21 nuits) à Bariloche, Argentine, au bord du lac Moreno. Les artistes
    de toutes disciplines (arts visuels, photographie, cinéma, curation, écriture,
    recherche, art sonore) sont accueillis pour explorer leurs processus créatifs.
    Le site, implanté dans un parc de 2,5 acres, offre à chaque artiste une chambre
    privée avec salle de bain, des espaces communs chauffés, Wi-Fi, électricité et
    cuisines communes. Une option de 2 semaines est possible. La résidence favorise
    la contemplation et la connexion au cadre naturel de la Patagonie en automne.
