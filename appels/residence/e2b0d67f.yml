analyse:
  synthese: 'Seqens lance un appel à manifestation d''intérêt pour une commande artistique
    de deux sculptures pérennes à Maurepas (Yvelines) dans la résidence Allée de l''Aube
    de 132 logements en réhabilitation. Le budget global est de 59 000 € HT, incluant
    conception, production, installation, rémunération et cession des droits patrimoniaux.
    Les artistes plasticiens ou sculpteurs peuvent candidater individuellement ou
    en groupement et doivent proposer une démarche de médiation dialoguant avec l''architecture
    d''Henri Gaudin et les usages des habitants. Deux à quatre candidatures seront
    présélectionnées pour une phase 2. Date limite : 30 novembre 2026.'
  pour_qui: Artistes plasticiens ou sculpteurs ayant une expérience confirmée de sculpture
    pérenne en extérieur, capables de concevoir une démarche de médiation et dialoguant
    avec l'architecture d'Henri Gaudin.
a_savoir:
- Budget global de 59 000 € HT couvre conception, matériaux, études, installation
  et rémunération. Montant exact des honoraires de l'artiste non individualisé.
- Indemnité de 2 000 € HT prévue pour candidats non retenus en phase 2 seulement (pas
  tous les candidats).
- 'Dossier complet obligatoire : absence d''une pièce administrative entraîne élimination
  automatique.'
- Visite du site recommandée pour comprendre les implantations et usages des habitants.
- 'Cession des droits patrimoniaux incluse dans le budget : périmètre et durée à clarifier
  contractuellement.'
- 'Première phase : références et note d''intention seulement, aucune esquisse demandée.'
- Obligation de médiation et de participation des habitants prévues, incluant temps
  de présence aux réunions et inauguration.
