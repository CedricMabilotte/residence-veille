  resume_fr: Six artistes ont été sélectionnés pour des résidences dans le cadre du
    projet ARES, une coopération de deux ans menée par WASP STUDIOS Bucharest, HIAP
    Helsinki et SCIAENA Faro. Les résidences se dérouleront en Finlande, Roumanie
    et Portugal, dans des zones perçues comme périphériques géographiquement, politiquement
    ou culturellement. L'appel à candidature a reçu 142 candidatures d'artistes engagés
    dans les questions de climat, justice et société. Les artistes répondront aux
    thèmes d'ARES dans les contextes spécifiques de leurs territoires de résidence.
    Le projet est financé par l'Union européenne.
