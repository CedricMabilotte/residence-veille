  synthese: 'ARES est un projet de coopération sur deux ans entre WASP STUDIOS (Bucharest),
    HIAP (Helsinki) et SCIAENA (Faro), financé par l''Union européenne. Il propose
    des résidences artistiques en Finlande, Roumanie et Portugal, en territoires perçus
    comme périphériques : côtes, deltas, contextes urbains post-industriels. Le projet
    accueille des artistes travaillant sur le climat, la justice et la société, pour
    mener une recherche artistique en réponse à la crise climatique, aux mutations
    économiques et à l''instabilité géopolitique. 142 candidatures ont été reçues
    ; 6 artistes ont été sélectionnés.'
