analyse:
  synthese: Le programme CALQ x Cité internationale des arts accueille 3 résidences
    par an d'une durée de 3 à 6 mois à destination des artistes québécois et autochtones.
    Créé en 1965 et refondé en 2025, il s'inscrit dans un partenariat de longue date
    ayant accueilli plus d'une centaine d'artistes québécois. Il vise à soutenir la
    mobilité, la recherche et la visibilité des créateurs québécois sur la scène artistique
    internationale. Les lauréats bénéficient d'un accompagnement professionnel et
    d'accès privilégiés aux offres culturelles parisiennes.
