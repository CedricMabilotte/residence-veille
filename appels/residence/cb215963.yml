    visuels, musiciens, écrivains, architectes et autres créateurs pour une durée
    de 1 à 3 meses. Les résidents disposent d'un logement privé (1.095 USD/mois pour
    l'aile arrière, 1.195 USD/mois pour l'aile avant), de trois repas végétariens
    quotidiens, et d'accès à des studios partagés ou privés sur un campus de 230 acres.
