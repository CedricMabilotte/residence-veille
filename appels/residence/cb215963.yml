analyse:
  synthese: 'Fundación ArteSumapaz propose une résidence artistique autogérée de 1
    à 3 mois en Cundinamarca, Colombie, destinée aux artistes visuels, musiciens,
    écrivains, architectes, céramistes, performeurs et autres créateurs. L''hébergement
    privé avec salle de bain coûte 1.095 ou 1.195 USD par mois selon la chambre, auquel
    s''ajoutent trois repas végétariens quotidiens. Les résidents ont accès à plusieurs
    espaces de travail (studios partagés et salles privées selon la discipline), et
    la participation aux critiques d''art hebdomadaires et événements est optionnelle.
    Une seule réunion obligatoire : la réunion communautaire hebdomadaire. Le programme
    se déploie sur un campus de 230 acres incluant un parc naturel, situé près de
    San Bernardo et Pandi.'
