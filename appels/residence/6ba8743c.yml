analisis:
  sintesis: Este documento es una resolución publicando los resultados de la VI Convocatoria
    de Residencias del Centro de Residencias Artísticas de Matadero Madrid 2026. Se
    seleccionaron cuatro residencias semestrales para artistas visuales de la Comunidad
    de Madrid (de 152 candidaturas), cuatro residencias trimestrales para artistas
    visuales residentes en España (de 121 candidaturas), y dos residencias trimestrales
    para artistas visuales de la Comunidad de Madrid (de 35 candidaturas). La comisión
    de valoración se reunió el 21 de noviembre de 2026.
