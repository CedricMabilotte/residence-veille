analyse:
  synthese: 'Résidence Tiny Spaces sélectionne six artistes pour un séjour d''un mois
    entre mai et août 2026, dans des ateliers rénovés à Oulu, Athènes et Potsdam.
    La résidence comprend 3 000 € de rémunération, l''hébergement, les frais de voyage
    (train et ferry), et les dépenses quotidiennes. Les artistes participent à une
    exposition collective et un symposium à Oulu en août 2026, avec archivage numérique
    des œuvres. Le programme explore des méthodes pour des résidences plus durables,
    axées sur le processus et la création in situ. Éligibilité : artistes résidant
    en UE ou Europe créative, toutes disciplines.'
