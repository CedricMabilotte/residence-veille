analyse:
  synthese: 'ArteSumapaz offers a self-directed artist residency in Colombia for 1–3
    months, with a June 2027 session (June 1–30). The program welcomes artists across
    visual arts, music, writing, performance, architecture, and related disciplines,
    providing studio spaces (painting, 3D, movement, music, private writing rooms),
    private accommodation with hot water and meals (3 vegetarian meals daily), on
    a 230-acre campus with natural park. Artists decide freely how to spend their
    time; participation in weekly critiques, workshops, and exhibitions is invited
    but optional, with only a weekly community lunch meeting required. This is a pay-to-play
    residency: artists pay USD 1095–1195 per month for accommodation and meals, with
    no artist stipend, travel support, or published selection criteria.'
  pour_qui: Visual artists, musicians, writers, architects, and other creative practitioners
    of all career levels seeking self-directed studio time in a collaborative community
    environment.
