  resume_fr: 'Programme de mentoring de 3 semaines offrant 27 heures d''instruction
    sur la peinture de codex mésoaméricain par le maestro studio d''Arquetopia. Les
    participants apprennent l''extraction de couleurs, la production de pigments (cochenille,
    bleu Maya, pigments terreux) et les techniques de peinture sur papier amate. L''instruction
    est en espagnol, bien que la maîtrise de la langue ne soit pas requise. Un mentorat
    individuel par l''équipe directrice et curatoriale est fourni. Date limite : 29
    novembre 2026.'
