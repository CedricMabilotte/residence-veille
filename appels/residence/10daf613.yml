analyse:
  synthese: Prisme est un dispositif d'aide à la mobilité destiné à trois artistes
    français·es basés hors Île-de-France, leur permettant de bénéficier d'une résidence
    de 3 mois à Paris (du 3 septembre au 29 novembre 2027) avec hébergement et bourse
    de 2 000 € par mois. Une des trois résidences est réservée à un photographe émergent
    ayant un projet traité des enjeux écologiques. Les lauréat·es bénéficient d'un
    accompagnement professionnel et d'une mise en réseau avec artistes et professionnels.
    La sélection s'appuie sur l'évaluation du parcours, la qualité artistique du projet
    et la pertinence d'une résidence à Paris.
  pour_qui: Artistes des arts visuels de nationalité française ou résidant en France
    depuis minimum 5 ans, basés hors Île-de-France et n'ayant jamais été en galerie
    dans cette région, avec une résidence prioritaire pour photographes émergent·es
    (max 5 ans d'activité) avec projet écologique.
a_savoir:
- Résidence réservée aux artistes français·es de la scène française basés hors Île-de-France
  ; critères de résidence administrative strictes
- Une des trois résidences est dédiée aux photographes émergent·es (maximum 5 ans
  d'activité professionnelle) avec projet traitant d'enjeux écologiques
- Dossier de candidature uniquement en français obligatoire
- 'Critères d''exclusion : ne jamais avoir été représenté·e par une galerie en Île-de-France,
