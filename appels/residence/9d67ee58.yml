analyse:
  synthese: Cette résidence accueille un duo artiste-chercheur pour 6 semaines réparties
    d'octobre 2026 à juin 2027 au Domaine du Rayol. Elle finance le projet à hauteur
    de 10 000 € pour le duo, couvre l'hébergement à la Villa Rayolet et les frais
    de déplacement et repas. Le projet explore la communication dans le vivant non-humain
    avec une approche interdisciplinaire, incluant une composante pédagogique auprès
    des élèves du Lycée du Golfe de Saint-Tropez et des visiteurs du Domaine.
  pour_qui: Artiste travaillant sur les sciences naturelles et les arts, avec une
    expérience en transmission et travail avec publics scolaires, candidatant en duo
    avec un chercheur.
a_savoir:
- Possession d'un véhicule obligatoire en raison de l'isolement géographique du Domaine
  (environ 45 minutes de la gare la plus proche)
- Logement classé situé à l'extrémité du jardin, dans un environnement très isolé
  et au cœur de la nature
- Le duo doit être constitué avant candidature ; l'organisme n'assure pas de mise
  en relation entre artistes et chercheurs
- Durée répartie sur plusieurs mois (3 semaines avec élèves, 3 semaines recherche/préparation),
  non continue
- Forte charge en transmission pédagogique et médiation avec publics multiples
