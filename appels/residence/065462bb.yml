  resume_fr: Cette convocation offre 2 résidences de production artistique pour des
    artistes visuels résidents dans la Communauté de Madrid. La résidence durera 3
    mois, du 14 avril au 10 juillet 2026, et comprendra un espace, des ressources
    économiques, un suivi professionnel et un accompagnement institutionnel. Les candidats
    doivent être des personnes physiques majeures ayant leur résidence légale en Espagne
    et un domaine d'action principal à Madrid. Les artistes peuvent se présenter individuellement
    ou en collectifs, avec désignation d'un représentant en cas de groupe. L'initiative
    vise à promouvoir le développement professionnel des créateurs visuels et établir
    des connexions entre les acteurs de la scène artistique locale.
