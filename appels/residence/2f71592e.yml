  resume_fr: La Résidence Communale Byrdcliffe Été 2027 accueille plus de 60 artistes
    visuels, littéraires et performatifs pour 4 semaines au sein de la colonie d'art
    historique de Byrdcliffe à Woodstock. Les dates limites de candidature sont 16
    novembre 2026 (examen prioritaire) et 23 novembre 2026 à 23:59. Le programme accepte
    les artistes du monde entier, à tous les stades de carrière, sur la base de l'excellence
    artistique et de l'engagement démontré ; des bourses couvrant les frais partiellement
    ou entièrement sont disponibles. Les résidents disposent de studios privés et
    partagés, d'équipements de céramique, d'une cuisine commune, et participent à
    des présentations d'artiste et des open studios.
