analyse:
  synthese: La Villa Kujoyama propose en 2027 environ 15 résidences de 4 à 6 mois
    à des artistes confirmés portant des projets de recherche originaux. Établissement
    français de recherche pluridisciplinaire fondé en 1992 à Kyoto, il renforce le
    dialogue interculturel entre France et Japon. Les candidatures acceptées en solo,
    binôme ou duo franco-japonais bénéficient du soutien d'une équipe dédiée et du
    réseau universitaire, culturel et scientifique japonais. Les projets doivent présenter
    un lien avec les enjeux territoriaux de Kyoto et du Kansai, et susciter un dialogue
    actif avec les acteurs locaux.
  pour_qui: Artistes et créateurs confirmés portant un projet de recherche singulier
    et interdisciplinaire lié aux enjeux du territoire japonais, éventuellement en
    binôme ou duo avec un scientifique ou partenaire japonais.
