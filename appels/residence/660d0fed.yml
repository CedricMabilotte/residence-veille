analyse:
  synthese: La Villa Kujoyama, première résidence artistique française de recherche
    pluridisciplinaire implantée en Asie, accueille chaque année environ 15 lauréats
    et lauréates pour des résidences de 4 à 6 mois. Le programme s'adresse à des artistes,
    créateurs et créatrices confirmés, ainsi qu'à des scientifiques (en duo ou binôme
    avec des artistes), porteurs de projets de recherche originaux et singuliers.
    Les candidatures peuvent être proposées en solo, en binôme, ou en duo franco-japonais.
    Le projet doit présenter un lien avec les enjeux du territoire et susciter un
    dialogue actif avec les acteurs locaux.
  pour_qui: Artistes, créateurs et créatrices confirmés, ainsi que scientifiques (en
    duo ou binôme avec des artistes), porteurs de projets de recherche singuliers
    et pluridisciplinaires.
