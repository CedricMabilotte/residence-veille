analyse:
  synthese: La Villa Kujoyama est une résidence artistique française pluridisciplinaire
    implantée à Kyoto, Japon, accueillant environ 15 lauréats par an pour des séjours
    de 4 à 6 mois. Elle s'adresse à des artistes, créateurs et scientifiques confirmés
    porteurs de projets de recherche originaux en lien avec les enjeux du territoire.
    Les résidents bénéficient d'un appui de l'équipe de la Villa et d'accès au réseau
    français au Japon constitué de 5 antennes de l'Institut français, 4 Alliances
    françaises, et d'un institut de recherche.
  pour_qui: Artistes, créateurs et créatrices confirmés, scientifiques en binôme ou
    duo franco-japonais avec des artistes, portant des projets de recherche singuliers
    nécessitant une immersion au Japon.
