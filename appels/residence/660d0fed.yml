analyse:
  synthese: Programme de résidences de recherche de 4 à 6 mois à Kyoto pour des artistes
    confirmés français et internationaux. La Villa Kujoyama, établissement du réseau
    de coopération culturelle du ministère, vise à renforcer le dialogue interculturel
    entre la France et le Japon. Les lauréats travaillent avec les milieux professionnels,
    universitaires et culturels de la région du Kansai et du Japon, appuyés par l'équipe
    de la Villa et le réseau français au Japon. Les candidatures sont acceptées en
    solo, binôme ou duo franco-japonais.
  pour_qui: Artistes et créateurs confirmés portant un projet de recherche original
    et singulier, seuls ou en collectif (binôme, duo franco-japonais), pouvant inclure
    des scientifiques.
