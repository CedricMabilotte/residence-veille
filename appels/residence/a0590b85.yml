analyse:
  synthese: La résidence d'ArteSumapaz en Colombie accueille artistes visuels, musiciens,
    écrivains, architectes et autres créateurs. Implantée sur un campus de 230 acres
    avec parc naturel, elle offre espaces de travail diversifiés (ateliers de peinture,
    3D, mouvement, studios de musique, salles d'écriture) et hébergement privé avec
    trois repas végétariens quotidiens inclus. La durée est flexible (1 à 3 mois)
    en novembre 2026, au tarif de 945 à 1045 USD/mois pour le logement. Les artistes
    conservent liberté totale de gérer leur emploi du temps; participation aux critiques
    hebdomadaires, ateliers ou expositions reste optionnelle. Aucune rémunération
    ou allocation n'est versée.
  pour_qui: Artistes confirmés ou émergents de tous horizons en capacité de financer
    leur séjour (945-1045 USD/mois) et recherchant une expérience de création autogérée
    en environnement collectif.
