analyse:
  synthese: Ce programme résidentiel s'adresse aux diplômés et post-diplômés de l'Académie
    des beaux-arts et du design de Bratislava. Il offre 3 mois de résidence à la Cité
    Internationale des Arts, avec 2 places disponibles par an. Le programme vise à
    soutenir l'intégration professionnelle d'artistes émergents dans les domaines
    des arts visuels, de l'architecture, du design, de la restauration et du commissariat.
    Les résidents bénéficient de rencontres régulières avec des artistes et professionnels
    de la culture. Le programme a été créé en 2021.
  pour_qui: Artistes diplômés ou post-diplômés de l'AFAD de Bratislava dans les disciplines
    visuelles, architecture, design, restauration ou commissariat.
