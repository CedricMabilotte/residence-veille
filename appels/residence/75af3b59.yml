analyse:
  synthese: The EMMA-Saastamoinen Curatorial Fellowship is a three-year program inviting
    one international curator annually to conduct independent research at EMMA while
    engaging with the Saastamoinen Foundation Art Collection, one of Finland's most
    significant collections of modern and contemporary art. The fellow develops a
    research project over six months, works alongside EMMA's curatorial staff, and
    concludes with a research article published on EMMA Zone. The residency is hosted
    at HIAP in Suomenlinna, Espoo.
  pour_qui: International curators with research-driven approaches and professional
    experience, particularly those interested in contemporary art, photography, moving
    images, and media arts seeking a six-month professional development opportunity.
