  resume_fr: Pauline Koffi Vandet, née en 1994, a été sélectionnée comme deuxième
    bénéficiaire de la EMMA–Saastamoinen Curatorial Fellowship par appel international.
    Elle travaillera six months à EMMA, menant une recherche indépendante sur la Saastamoinen
    Foundation Art Collection, l'une des collections d'art moderne et contemporain
    les plus importantes de Finlande. Son projet culminera en un article de recherche
    basé sur cette collection, à publier sur EMMA Zone, la plateforme numérique du
    musée. Elle sera hébergée à HIAP – Helsinki International Artist Programme à Suomenlinna.
    Cette initiative de three-year accueille chaque année un curateur international
    pour s'engager avec la collection et apporter de nouvelles perspectives à la recherche
    et aux pratiques curatoriales.
