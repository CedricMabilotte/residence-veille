analyse:
  synthese: La Fondation Renaud propose une résidence artistique de 12 semaines à
    partir de mi-avril 2027 au Fort de Vaise à Lyon, ouverte aux artistes plasticiens
    et visuels de tous niveaux autour du thème 2027 « Entre les mains » (arts populaires
    et patrimoine). Le lauréat reçoit une bourse de 2 200 € lissée sur 3 mois, une
    aide à la production jusqu'à 2 000 € TTC, un logement et un espace de travail
    de 48 m² + 15 m² de mezzanine, avec une présence d'au moins 20 heures par semaine
    obligatoire. Dix candidatures supplémentaires seront retenues pour une exposition
    collective. Les frais de déplacement ne sont pas pris en charge.
  pour_qui: Artistes plasticiens et visuels de tous niveaux, intéressés par les arts
    populaires, le patrimoine, les collections ou les cabinets de curiosités, ayant
    une pratique compatible avec un espace non-équipé techniquement.
a_savoir:
- 'Rémunération faible pour une résidence de 3 mois : 2 200 € TTC total (environ 733
  € par mois)'
- L'aide à la production de 2 000 € correspond à des frais de réalisation sur justificatifs,
  non à une rémunération supplémentaire
- Les frais de déplacement ne sont pas pris en charge
- Présence obligatoire d'au moins 20 heures par semaine pendant les 12 semaines
- 'L''espace de création n''est pas un atelier technique complet : les pratiques lourdes,
  très salissantes ou nécessitant des équipements spécifiques peuvent être moins adaptées'
- Le logement fourni et l'aide à la production compensent partiellement la faible
  rémunération mensuelle
- 'Opportunité annexe : même sans obtenir la résidence principale, 10 projets supplémentaires
  seront sélectionnés pour l''exposition collective LAB 10+1'
