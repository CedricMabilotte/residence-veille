analyse:
  synthese: Ce programme permet aux artistes résidant à l'étranger depuis au moins
    5 ans de développer un projet de recherche et de création à Paris pendant 3, 6
    ou 9 mois entre avril 2027 et avril 2028. Environ 70 lauréats provenant du monde
    entier sont accueillis annuellement. L'Institut français et la Cité internationale
    des arts fournissent un atelier-logement de 25 à 40 m². Le partenaire associé
    de chaque artiste finance une allocation minimum de 1100€ mensuels, le voyage
    international, l'assurance et les frais de visa. Les prestations complémentaires
    restent à la charge des résidants.
  pour_qui: Artistes et professionnels de la culture de toutes nationalités, maîtrisant
    le français et/ou l'anglais à niveau professionnel, engagés dans une démarche
    professionnelle reconnue et parrainés obligatoirement par une structure culturelle
    associée.
a_savoir:
- Les candidatures directes d'artistes ne sont pas acceptées ; un partenaire associé
  (Institut français, structure culturelle reconnue, galerie, etc.) est obligatoire
- 'La résidence requiert une disponibilité totale : être libéré de toute activité
  professionnelle pendant toute la durée'
- Les ateliers-logements ne répondent pas aux normes actuelles d'accessibilité pour
  les personnes en situation de handicap
- Allocation minimum de 1100€/mois financée par le partenaire associé, pas par l'Institut
  français ; taux modeste pour le coût de vie parisien
