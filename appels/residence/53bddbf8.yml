analyse:
  synthese: Le programme Institut français x Cité internationale des arts (édition
    2027) accueille environ 70 artistes de toutes nationalités pour une résidence
    de 3, 6 ou 9 mois à Paris entre avril 2027 et avril 2028. Chaque lauréat reçoit
    un atelier-logement de 25 à 40 m², une allocation minimum de 1 100 € par mois,
    la prise en charge du voyage et de l'assurance par le partenaire associé. Le programme
    s'adresse aux artistes de plus de 20 disciplines ayant résidé hors de France depuis
    au moins 5 ans et portés par un partenaire associé reconnu.
  pour_qui: Artistes et professionnels de la culture de toutes nationalités, sans
    limite d'âge, ayant résidé hors de France depuis au moins 5 ans, dans les disciplines
    reconnues, libérés de toute activité professionnelle durant la résidence.
a_savoir:
- 'Candidatures obligatoirement portées par un partenaire associé : pas d''autocandidat
  accepté.'
- Condition stricte de résidence hors France depuis minimum 5 ans.
- Ateliers-logements ne répondant pas aux normes actuelles d'accessibilité aux personnes
  en situation de handicap.
- Frais supplémentaires pour les accompagnants (non chiffrés dans l'appel).
- Maîtrise du français et/ou anglais à niveau professionnel requise.
- Allocation de 1 100 € par mois versée par le partenaire, modeste au regard du coût
  de la vie à Paris.
