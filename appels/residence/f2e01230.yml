analyse:
  synthese: 'ArteSumapaz propose une résidence artistique autogérée pour l''automne
    2027 en Colombie, ouverte à tous les artistes (plasticiens, musiciens, écrivains,
    architectes, danseurs, performeurs, autres pratiques). La résidence fournit l''hébergement
    (chambre privée, salle de bain, bureau, rangement), l''accès à cinq studios partagés
    ou privés (peinture, 3D, mouvement, musique, écriture), et trois repas végétariens
