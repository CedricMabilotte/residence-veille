  resume_fr: Matadero Madrid lance un appel à candidatures pour attribuer 8 résidences
    de production artistique d'une durée de 3 mois, du 15 septembre au 15 décembre
    2026, destinées aux artistes visuels résidents en Espagne travaillant sur l'environnement.
    Les résidences offrent des espaces de création, des ressources économiques, un
    suivi professionnel et un accompagnement institutionnel. Les projets peuvent aborder
    la pollution, le changement climatique, l'exploitation des ressources naturelles,
    les espaces ruraux ou l'industrie alimentaire. La sélection se fera selon les
    principes de publicité, concurrence, transparence, objectivité, égalité et non-discrimination.
