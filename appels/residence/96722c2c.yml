    se dérouleront du 15 septembre au 15 décembre 2026. L'appel vise à soutenir le
    développement professionnel des créateurs, leur fournir des ressources spatiales,
    économiques et institutionnelles, et placer la question environnementale au cœur
    des débats artistiques. Le programme s'adresse aux créateurs d'arts visuels individuels
    ou collectifs travaillant sur des questions liées à l'environnement et résidant
    dans la Communauté de Madrid et/ou en Espagne.
