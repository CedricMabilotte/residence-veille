  resume_fr: Appel à candidature pour une résidence d'artistes visuels au Banff Centre
    for Arts & Creativity, explorant comment les lieux « chantent » à travers l'écologie
    acoustique et les montagnes de Banff. La résidence dure 5 semaines, avec une deadline
    du 18 novembre 2026, et accueille en moyenne 17 artistes simultanément. Les participants
    reçoivent des studios individuels, un mentorat dirigé par des professeurs, tous
    les repas et l'accès à des équipements spécialisés en céramique, travail du métal,
    photographie et autres disciplines. Le programme est ouvert aux artistes du monde
    entier, à tous les stades de carrière, avec une accessibilité partielle (50% ou
    plus) et un logement conforme aux normes ADA.
