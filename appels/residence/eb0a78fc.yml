analyse:
  synthese: La Cité internationale des arts propose, en partenariat avec l'Institut
    français d'Indonésie et la Fundação Oriente, une résidence de trois mois à Paris
    destinée aux artistes timorais. Les lauréats bénéficient d'une bourse mensuelle
    de 850 euros, d'un atelier-logement meublé de 25 à 40 m², de la prise en charge
    du transport international aller-retour, des frais d'assurance voyage et de visa,
    et d'une enveloppe d'arrivée de 200 euros. Un seul candidat sera sélectionné.
    La date limite de candidature est le 30 août 2026.
  pour_qui: Artistes professionnels de nationalité timoraise, sans limite d'âge, justifiant
    d'au moins 5 ans d'activité professionnelle artistique et maîtrisant l'anglais
    ou le français.
