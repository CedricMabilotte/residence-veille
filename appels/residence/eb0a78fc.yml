- Nationalité timoraise obligatoire (restriction majeure)
- Durée courte de 3 mois seulement
- Transport d'œuvres ou de matériel d'expérimentation non pris en charge
- Ateliers-logements non accessibles aux personnes en situation de handicap selon
  les normes actuelles
- Bourse mensuelle de 850 euros (budget serré pour Paris)
