analyse:
  synthese: Residencia intensiva de 2 semanas en Medialab Matadero (12-25 de noviembre
    de 2026) para desarrollar 5 prototipos de proyectos técnicos o culturales en modo
    colaborativo. 25 participantes distribuidos en 5 grupos de trabajo, con mentoría
    de 3 expertas internacionales. Abierto a todas las disciplinas vinculadas con
    culturas visuales, tecnología, arquitectura, escritura, ciencias, etc., sin restricción
    de origen ni residencia. Programa completamente gratuito, que incluye alojamiento,
    desplazamiento y manutención para todos los participantes no residentes en la
    Comunidad de Madrid.
  para_quien: Artistas, diseñadores, investigadores, técnicos, activistas y profesionales
