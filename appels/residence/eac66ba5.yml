  resume_fr: Matadero Madrid lance un appel à candidatures pour le Laboratorio de
    Prototipado Colaborativo (LPC), une résidence de création qui se déroulera entre
    le 12 et le 25 de noviembre de 2026 à Medialab Matadero. L'appel recherche 5 personas
    promotoras de proyectos et jusqu'à 20 colaboradores pour développer collaborativement
    5 prototipos pendant deux semaines intensives. Les candidatures sont ouvertes
    jusqu'au 14 de junio. Les projets seront présentés publiquement entre le 26 et
    le 28 de noviembre de 2026 lors du festival OpenLAB. L'appel est ouvert à toute
    personne majeure ayant une formation ou expérience dans les cultures visuelles,
    technologies, architecture, écriture, sciences, ingénierie ou domaines connexes.
