  resume_fr: Le Centre de Résidences Artistiques de Matadero Madrid lance un appel
    à candidatures pour quatre (4) résidences de production artistique destinées aux
    artistes visuels résidant en Espagne, en dehors de la Communauté de Madrid. Les
    résidences auront une durée de trois (3) mois, du 13 janvier au 10 avril 2026.
    Le programme fournit des espaces, des ressources économiques, un accompagnement
    curatorial et institutionnel, ainsi qu'une visibilité aux candidats sélectionnés.
    Les candidatures sont ouvertes aux créateurs individuels ou collectifs, majeurs
    et résidant légalement en Espagne.
