analyse:
  synthese: Ce programme propose une résidence de 12 semaines (1er mars au 28 mai
    2027) à Eindhoven pour un artiste, designer ou architecte professionnel de nationalité
    espagnole. Make Eindhoven met à disposition un accès 24/7 à ses ateliers spécialisés
