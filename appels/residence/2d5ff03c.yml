analyse:
  synthese: Résidence artistique rurale d'avril 2027 en Tennessee, 2 mois, ouverte
    à tous les artistes du monde et tous niveaux de carrière. Logement fourni en chambre
    privée au sein d'une structure collective. Studios privés ou partagés selon disponibilité.
    Aucune rémunération ni stipend de voyage. Frais de résidence de 450 USD par semaine
    (minimum). Scholarship jusqu'à 300 USD possible en échange de 6 heures par semaine
    de travail physique sur le site (jardinage, aménagement paysager, etc.).
  pour_qui: Artistes cherchant l'immersion créative en environnement naturel, prêts
    à se déconnecter de la vie urbaine et disposés à contribuer physiquement quelques
    heures par semaine.
a_savoir:
- 'Aucune rémunération ou stipend de voyage : artiste finance intégralement les frais
  de résidence (450 USD/semaine minimum).'
- Farm Stay Scholarship impose un engagement physique obligatoire (6 heures par semaine
  de travail agricole/paysager).
- 'Isolement géographique intentionnel, structure délibérément éloignée de la vie
  urbaine et connectivité contemporaine : non recommandé pour artistes ayant besoin
  de métropole ou d''accès rapide.'
- 'Deadline très proche : 30 novembre 2026.'
- Restitution attendue (donation d'œuvre), sans mention d'exposition publique ni visibilité
