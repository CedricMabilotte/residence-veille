analyse:
  synthese: Appel annuel pour une exposition collective de 8 à 12 artistes en arts
    visuels autour de la thématique « Mémoire(s) et territoire ». Chaque participant
    reçoit 150 € de défraiement. L'exposition se tient du 6 mars au 2 avril 2027 avec
    vernissage public et communication municipale (flyers, affiches, catalogue, site,
    journal municipal, réseaux sociaux). Une œuvre est acquise par la Ville pour 2
    500 €, une bourse de création de 500 € est attribuée par l'association Utrillo-Valadon,
    et un artiste peut animer un stage rémunéré 200 €. Les candidatures sont attendues
    jusqu'au 7 janvier 2027.
  pour_qui: Artistes en arts visuels de tous niveaux et nationalités ayant des œuvres
    en lien avec la mémoire et le territoire.
a_savoir:
- Les 150 € constituent un défraiement et non des honoraires d'exposition.
- Transport, assurance et retour des œuvres ne sont pas détaillés ; à vérifier auprès
  de l'organisme.
- Une seule œuvre est acquise à 2 500 € (sélection par le jury).
- Un seul artiste sera retenu pour animer le stage rémunéré 200 € (avec 150 € de budget
  matériel).
- Dossier limité à 20 Mo ; visuels haute définition à transmettre séparément.
- Paiements assurés par la Ville nécessitent facturation via Chorus Pro.
- Droits d'auteur en catalogue et supports de communication à clarifier avec l'organisme.
