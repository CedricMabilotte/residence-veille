analyse:
  synthese: La Révélation Arts plastiques est un prix créé par l'ADAGP depuis 2015,
    désormais décerné en partenariat avec 100% L'EXPO à La Villette, Paris. Il récompense
    annuellement un artiste émergent dans le domaine des arts plastiques avec une
    dotation de 5 000 €. Le lauréat bénéficie d'une présentation dédiée aux cimaises
    de l'ADAGP accompagnée d'un texte critique ou de documentation photographique.
    L'ADAGP verse également une aide financière supplémentaire à tous les artistes
    participants.
  pour_qui: Artistes émergents dans les arts plastiques, s'inscrivant dans la jeune
    création contemporaine française.
