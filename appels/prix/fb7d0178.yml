  resume_fr: LAB 4 Weird Futures est le quatrième laboratoire organisé par Medialab
    Matadero pendant 2025. Il invite artistes, technologues, designers et citoyens
    à explorer l'instabilité de la société contemporaine et ses futures technologiques.
    L'activité principale est un Laboratoire de Prototypage de deux semaines où 5
    projets collaboratifs seront développés, sélectionnés par appel public. Le programme
    culmine avec le festival OpenLAB de trois jours en novembre 2025. Le laboratoire
    explore notamment un concept appelé « teslaforming » qui examine comment la technologie
    remodèle la société contemporaine.
