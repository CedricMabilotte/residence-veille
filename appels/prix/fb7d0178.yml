  resume_fr: LAB 4 Weird Futures est le quatrième laboratoire interdisciplinaire de
    Medialab Matadero en 2025, culminant avec le festival OpenLAB de trois jours en
    novembre 2025. Son activité principale est un Laboratoire de Prototypage de deux
    semaines dirigé par des artistes et penseurs internationaux renommés, qui développera
    5 projets collaboratifs sélectionnés par appel public international. Un second
    appel recrute les collaborateurs pour ces projets. Le programme explore l'instabilité
    de la société contemporaine et les futurs possibles à travers le concept de «
    teslaforming », invitant artistes, technologues, designers critiques et citoyens
    à examiner les transformations technologiques du 21ème siècle.
