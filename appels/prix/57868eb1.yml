analyse:
  synthese: 'La Caennaise lance une commande artistique pour la création d''une œuvre
    destinée aux halls de deux bâtiments du Science Park EPOPEA à Caen (Maison des
    Chercheurs Josette Travert et résidence étudiante). L''œuvre doit proposer une
    identité artistique commune, adaptée à trois espaces, en dialogue avec l''architecture,
    la recherche et l''innovation, sans alimentation électrique ni maintenance régulière.
    Le lauréat percevra 8 000 € (dont 1 000 € d''indemnité d''esquisse incluse), plus
    2 500 € pour la réalisation. Les trois présélectionnés sont indemnisés 1 000 €
    chacun pour l''esquisse. Date limite : 30 novembre 2026 ; installation prévue
    juin 2027.'
  pour_qui: Artistes visuels individuels ou collectifs capables de concevoir une installation
    murale durable et autonome adaptée à des espaces collectifs, intégrant des publics
    d'étudiants, chercheurs et professionnels internationaux.
a_savoir:
- 'Calendrier extrêmement resserré : candidature avant 30/11/2026, annonce présélection
  21/12/2026, remise esquisses 29/01/2027 à 17h, auditions février 2027, installation
  juin 2027'
- 'Confusion tarifaire majeure : les 1 000 € d''esquisse pour les trois présélectionnés
  sont INCLUS dans les 8 000 € du lauréat, ils ne s''y ajoutent pas'
- 'Budget de production très limité : 2 500 € pour couvrir matériaux, fabrication,
  transport et installation — estimation technique rigoureuse indispensable'
- 'Cession des droits d''auteur très étendue : droits patrimoniaux exclusifs de reproduction
  et représentation pour le monde entier et toute la durée légale de protection, compris
  dans le montant'
- 'Contraintes techniques strictes : matériaux durables, fixations sécurisées, conformité
  aux règles incendie, absence d''alimentation électrique, maintenance simple, sans
  emprise au sol ni entrave à la circulation'
- Obligation de déclarer tout recours à l'intelligence artificielle dans le processus
  artistique ou technique
- 'Durée de présentation imposée : minimum 5 ans après installation, avec possibilité
  de retrait/déplacement à l''issue selon le contrat'
- 'Annulation unilatérale possible : La Caennaise se réserve le droit de ne pas réaliser
  la commande, les indemnités d''esquisse restant dues'
- 'Capacité administrative requise : numéro SIRET, affiliation régime artistes-auteurs
  ou équivalent, assurance responsabilité civile professionnelle obligatoire'
