analyse:
  synthese: La Fondation des Artistes propose un dispositif d'aide à la production
    destiné aux artistes plasticiens français ou étrangers résidant en France. Le
    programme finance la phase de préparation et de réalisation de projets ambitieux
    et innovants (résidence, recherche, production), excluant la post-production et
    la diffusion. La commission se réunit deux fois par an pour examiner les dossiers
    et décider de l'attribution des aides par vote majoritaire. Aucune condition d'âge
    n'est imposée.
  pour_qui: Artistes plasticiens français ou étrangers résidant légalement en France,
    porteurs de projets de création ambitieux et innovants.
a_savoir:
- Pas de date limite de candidature visible dans le document (à consulter sur le site
  officiel)
- Les artistes ayant obtenu une aide doivent attendre trois années révolues avant
  de pouvoir présenter un nouveau dossier
- Les artistes ayant eu une candidature rejetée doivent attendre une année révolue
  avant de présenter un nouveau projet
- Un seul dossier par artiste et par commission
- Un même projet ne peut être soumis qu'une seule fois, sauf autorisation spéciale
- Aucun formalisme strict imposé, mais dossier dématérialisé obligatoire
