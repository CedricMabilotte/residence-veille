analyse:
  synthese: La Fondation des Artistes propose des aides à la production d'œuvres d'art
    via une commission mécénat se réunissant deux fois par an (printemps et automne).
    Le programme s'adresse à tous les artistes plasticiens sans limite d'âge, français
    ou étrangers résidant en France, pour financer les phases de préparation, recherche
    et production de projets ambitieux et innovants. L'aide ne finance que la production
    et la résidence, jamais la post-production ou la diffusion. Candidature uniquement
    en ligne.
  pour_qui: Artistes plasticiens français ou étrangers résidant en France, à tous
    les stades de leur carrière, avec des projets ambitieux et innovants en phase
    de préparation ou production.
a_savoir:
- Dates limites et montants d'aide non spécifiés dans ce document réglementaire ;
  consultez le site
- Artistes ayant reçu une aide ne peuvent présenter un nouveau dossier que 3 ans après
  (6 commissions)
- Artistes refusés doivent attendre 1 an (2 commissions) avant une nouvelle candidature
- Un seul dossier par artiste et par session de commission
- Dépôt exclusivement en ligne et dématérialisé
- L'aide exclut explicitement post-production et diffusion
