  resume_fr: 'Matadero Madrid lance la quatrième édition du programme annuel Medialab
    pour sélectionner trois projets de recherche au cours de la période 2025-2026.
    Ces projets doivent explorer les relations entre l''art contemporain, le design,
    la science, la technologie et la société, sur une période maximale d''un an. L''invitation
    s''adresse aux individus ou groupes menant des recherches dans des domaines variés
    : design, art, architecture, sciences, philosophie, ingénierie, etc. Les participants
    doivent contribuer à la création d''un espace ouvert d''échange avec les audiences
    et communautés de Medialab Matadero.'
