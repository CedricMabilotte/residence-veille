  resume_fr: Il s'agit d'un appel à candidatures pour sélectionner trois projets de
    recherche situés dans le cadre du programme annuel Medialab Matadero à Matadero
    Madrid pour la période 2025-2026. Medialab Matadero, programme du centre de création
    contemporaine Matadero Madrid géré par Madrid Destino, promeut la recherche multidisciplinaire,
    collaborative et ouverte explorant les relations entre art contemporain, design,
    science, technologie et société. Les trois projets seront développés sur une période
    d'un an maximum et doivent engager un dialogue avec le programme annuel et les
    communautés associées à Medialab Matadero. Les candidats peuvent être des individus
    ou des groupes travaillant dans des domaines tels que le design, l'art, l'architecture,
    l'urbanisme, l'économie, le cinéma, la photographie, le journalisme, les médias
    numériques, les sciences environnementales, la philosophie, l'ingénierie, les
    études sociales, et autres. Les langues de travail sont l'espagnol et l'anglais.
