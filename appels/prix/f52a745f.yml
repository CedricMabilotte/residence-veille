analyse:
  synthese: This is the fourth edition of Medialab Matadero's Annual Research Projects
    Program, an open international invitation to select three research projects for
    the 2025-2026 period. The program supports projects exploring relationships between
    contemporary art, design, science, technology and society, grounded in learning-by-doing
    principles. Projects must engage with Medialab's thematic lines (Sentient Media,
    The Metabolic Sublime, Synthetic Minds, Weird Futures) and contribute to exchange
    with local and international audiences, culminating in a public presentation at
    Matadero Madrid.
  pour_qui: Individuals or groups conducting research in design, art, architecture,
    urban planning, economics, film, photography, journalism, digital media, environmental
    sciences, philosophy, engineering, social studies, political science, digital
    tool programming, material sciences, activism or related fields; must be of legal
    age and authorized to stay in Spain during the research project.
