analyse:
  synthese: Appel à sélectionner trois projets de recherche situés pour 2025-2026
    à Matadero Madrid. Les projets doivent explorer les intersections entre art, design,
    science, technologie et société, alignés avec les thématiques Sentient Media,
    The Metabolic Sublime, Synthetic Minds et Weird Futures. Madrid Destino prend
    en charge les frais de dissémination, d'apprentissage et de retours publics approuvés.
    Une présentation publique des résultats doit être organisée à Matadero.
  pour_qui: Chercheurs, artistes et créatifs individuels ou collectifs issus de domaines
