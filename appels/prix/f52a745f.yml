  resume_fr: Matadero Madrid lance une invitation internationale pour sélectionner
    trois projets de recherche dans le cadre du programme Medialab Matadero 2025-2026.
    Les projets doivent explorer les relations entre art contemporain, design, science,
    technologie et société de manière innovante. La durée maximale de développement
    est d'un an, et les candidats peuvent provenir de disciplines diverses (art, design,
    architecture, sciences, etc.). Les projets doivent être collaboratifs, expérimentaux
    et rigoureux, avec l'espagnol et l'anglais comme langues de travail.
