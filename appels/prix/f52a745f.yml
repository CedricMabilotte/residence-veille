analyse:
  synthese: Medialab Matadero invites submissions for three situated research projects
    to be developed over a maximum period of one year (2025-2026). Projects should
    explore intersections between art, design, science, and technology, addressing
    contemporary urban and global challenges aligned with the Sustainable Development
    Goals. The program is open internationally to individuals or groups across multiple
    disciplines, and Madrid Destino will cover costs of approved learning, dissemination,
    and public feedback activities. Projects must engage with Medialab's thematic
    lines and communities, and be presented in Spanish or English.
  pour_qui: Researchers, artists, and professionals from diverse fields conducting
    innovative, collaborative, and experimental research at the intersections of contemporary
    art, design, science, and technology.
