analyse:
  synthese: Le LAB 5 The Mechanics of Truth est un laboratoire de prototypage collaboratif
    de deux semaines organisé par Medialab Matadero, accueillant jusqu'à cinq (5)
    projets et un maximum de vingt (20) collaborateurs de toute discipline et niveau
