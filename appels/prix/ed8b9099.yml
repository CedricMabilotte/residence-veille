analyse:
  synthese: LAB 5 The Mechanics of Truth is an intensive 2-week collaborative prototyping
    laboratory (12–25 November 2026) selecting 5 projects and up to 20 collaborators
    from any discipline and background worldwide. Participants form interdisciplinary
    teams supported by expert mentors, working in provided workspace to develop projects
    exploring technological mechanisms of reality and truth. Results presented publicly
    at OpenLAB festival, 26–28 November 2026, at Matadero Madrid. Medium-high English
    proficiency required; projects developed using open-source tools and shared under
    Creative Commons licenses.
