analyse:
  synthese: 'Etant donnés pour l''Art contemporain, créé en 1994 par Villa Albertine,
    l''Institut français et le Ministère de la Culture, soutient la circulation artistique
    entre la France et les États-Unis selon trois axes : subventions aux institutions
    américaines à but non lucratif pour expositions/recherche, bourses aux conservateurs
    américains, résidences de 2 à 4 mois pour artistes français. Le programme embrasse
    les arts visuels, le design, l''architecture et la performance. Depuis sa création,
    3 millions de dollars ont financé plus de 300 projets.'
  pour_qui: Artistes visuels français ou basés en France (tous niveaux de carrière),
    conservateurs américains indépendants ou affiliés, institutions américaines à
    but non lucratif.
