analyse:
  synthese: La Fondation des Artistes soutient les écoles d'art en France pour faciliter
    la transition professionnelle des jeunes diplômés. Le programme Quilt de l'ESBAN
    Nîmes (2024/2025 et 2025/2026) offre une bourse de 5 000 euros par artiste accompagnée
    individuellement et collectivement. La première édition a soutenu 4 projets d'alumni
