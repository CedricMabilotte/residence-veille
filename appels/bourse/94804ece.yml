  resume_fr: 'Appel à chapitres pour une collection intitulée « Un point à la fois
    », explorant la broderie comme technologie narrative (date limite : 30 juin 2027).
    La broderie a servi pendant des millénaires de mode de narration visuelle et d''archivage
    historique, depuis des textiles de 12 000 ans découverts à la Guitarrero Cave
    jusqu''à la tapisserie de Bayeux. Elle a fonctionné comme outil de résistance
    politique, notamment au travers du projet « The Red Dress » qui rassemble 380
    personnes de 51 pays. Les chapitres proposés peuvent aborder l''archivage historique,
    l''agentivité, l''identité, la résistance politique, les droits humains, la justice
    sociale et l''activisme.'
