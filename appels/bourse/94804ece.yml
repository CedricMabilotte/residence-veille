analyse:
  synthese: The Textile Society of America invites abstracts for an edited anthology
    titled 'One Stitch at a Time,' exploring embroidery and needlecraft as narrative
    technologies for storytelling, cultural memory, and resistance. Contributors submit
    a 150-word abstract with 3 keywords and 50-word bio by December 10, 2026; accepted
    contributors then submit a completed essay of minimum 7,000 words by June 30,
    2027. The anthology will be published by a university press in the United States.
  pour_qui: Scholars, artists, writers, and researchers in embroidery, textile arts,
    needlecraft, and related disciplines exploring themes of cultural identity, resistance,
    activism, human rights, social memory, and narrative within literature, visual
    arts, history, and cultural studies.
