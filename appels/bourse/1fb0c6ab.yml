analyse:
  synthese: This is a comprehensive funding guide published by On the Move in partnership
    with ASEF, listing cross-border mobility opportunities for artists and cultural
    workers. It covers both outgoing opportunities (for Indonesian nationals and residents
    traveling abroad) and incoming opportunities (for international artists traveling
    to Indonesia). The guide includes regular, online-accessible opportunities such
    as touring, residencies, collaborations, and training programs from public and
    private funders.
  pour_qui: Artists and cultural workers who are Indonesian nationals, residents,
    or seeking to work in Indonesia across all artistic disciplines.
a_savoir:
- This is a guide/directory, not a direct application opportunity—users must identify
  specific programs listed within the guide and apply directly to them.
- The guide was last updated in 2024 but focuses on regular, ongoing opportunities
  (not one-off or short-term programs).
- Only opportunities accessible online with open calls are included; offline or non-open-call
  schemes are excluded.
