  source_lang: en
  resume_fr: 'Le guide recense les sources de financement nationales, locales et internationales
    pour la mobilité transfrontalière des artistes et travailleurs culturels depuis
    et vers l''Indonésie. Il propose deux catégories d''opportunités : les bourses
    pour les résidents indonésiens souhaitant voyager à l''étranger, et les bourses
    pour les artistes étrangers venant en Indonésie. Le guide inclut uniquement les
    opportunités régulières accessibles en ligne, telles que les tournées, résidences,
    collaborations et formations. Publié en 2016 et 2024 par On the Move en partenariat
    avec l''Asia-Europe Foundation, ce guide s''inscrit dans une série de 60 guides
    de financement publiés depuis 2011.'
