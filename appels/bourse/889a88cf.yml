analyse:
  synthese: 'Appel à projets porté conjointement par l''Institut français, l''Institut
    Adam Mickiewicz, l''Institut polonais de Paris et l''Ambassade de France en Pologne
    pour la Saison Pologne-France 2027. S''adresse à structures françaises ou polonaises
    souhaitant proposer des projets culturels en Pologne dans sept disciplines : architecture,
    arts visuels/photographie, cinéma, création numérique, débat d''idées, livre,
    métiers d''art/design, spectacle vivant/musique. Les projets doivent s''inscrire
    dans l''une de quatre thématiques : démocratie et solidarités, Europe en partage,
    agentivité à l''ère algorithmique, ou France-Pologne : héritages partagés. Date
    limite : 22 juin 2026.'
  pour_qui: Structures culturelles françaises ou polonaises (publiques, privées, associations)
    cherchant à développer des projets et coopérations culturelles franco-polonaises.
