analyse:
  synthese: 'The Japan Foundation grants is a suite of funding programs supporting
    cultural exchange and collaboration between Japan and ASEAN countries, with international
    dimensions. It covers dispatching artists and specialists, collaborative performing
    arts productions, funding for organizations implementing exchange projects, individual
    fellowships for research and creative work, and support for exhibitions and publications
    of Japanese culture. Deadline: 1 December 2026. No specific funding amounts are
    stated in the call.'
  pour_qui: Artists, cultural specialists, curators, researchers, museums, institutions,
    and organizations working in performing arts, visual arts, and cultural fields
    seeking to foster exchange and collaboration with Japan or ASEAN countries.
