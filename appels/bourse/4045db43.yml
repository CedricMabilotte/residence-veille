  resume_fr: La Fondation du Japon propose plusieurs appels à candidatures pour soutenir
    l'internationalisation des arts japonais par des organisations nationales et internationales.
    Elle offre des programmes de financement pour le dispatching d'artistes et de
    spécialistes, les créations performatives internationales, les échanges culturels
    en Asie, les bourses pour recherche artistique, les expositions et les traductions
    de publications. Dans le cadre du 50e anniversaire de la coopération ASEAN-Japon
    (2023), elle met en place le « WA Project 2.0 » visant à promouvoir les échanges
    de la prochaine génération entre le Japon et l'ASEAN. Les candidatures doivent
    être soumises avant le 1 décembre 2026.
