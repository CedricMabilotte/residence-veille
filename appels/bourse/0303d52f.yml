analyse:
  synthese: L'ADAGP en partenariat avec l'Institut français de Madrid lance la Bourse
    Connexion Internationale 2026 pour soutenir financièrement les structures de diffusion
    espagnoles présentant des expositions d'artistes de la scène française. Trois
    aides de 10 000€ chacune sont attribuées pour des projets dans les disciplines
    des Beaux-arts et Arts Appliqués, Photographie, BD et Livre jeunesse. Les expositions
    doivent être monographiques ou collectives et réalisées dans un délai maximum
    de 2 ans. Aucun critère d'adhésion à l'ADAGP n'est requis, et les artistes exposés
    peuvent être de toute nationalité à condition de travailler ou résider en France
    depuis au moins 5 ans, ou de nationalité française vivant à l'étranger.
  pour_qui: Cette bourse s'adresse aux structures de diffusion espagnoles publiques
    ou privées à but non lucratif (musées, centres d'art, artist-run spaces, fondations,
    festivals, médiathèques, bibliothèques) disposant d'un espace de diffusion pérenne
    et souhaitant présenter des expositions d'artistes de la scène française.
a_savoir:
- La bourse est destinée aux structures de diffusion, pas versée directement aux personnes
  physiques
- Dossier de candidature obligatoirement en anglais
- Les structures doivent avoir un espace de diffusion pérenne (pas de lieux nomades)
- Délai maximum de 2 ans pour la réalisation de l'exposition
- Aucun critère d'adhésion à l'ADAGP n'est requis pour les artistes exposés
