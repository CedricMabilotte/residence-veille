analyse:
  synthese: La Bourse Connexion Internationale 2026 est un programme lancé par l'ADAGP
    et l'Institut français de Madrid pour soutenir la diffusion d'artistes de la scène
    française en Espagne. Trois aides de 10 000€ (total 30 000€) sont attribuées annuellement
    à des structures de diffusion espagnoles à but non lucratif qui organisent des
    expositions d'artistes français en Beaux-arts et Arts Appliqués, Photographie,
    BD et Livre jeunesse. Les artistes doivent être de toute nationalité mais résider
    ou travailler en France depuis au moins 5 ans, ou être français vivant à l'étranger.
    L'exposition doit être réalisée dans un délai maximum de 2 ans après attribution.
    Les candidatures en anglais sont à déposer avant le 15 juillet 2026 à 14h.
  pour_qui: Structures de diffusion espagnoles à but non lucratif (musées, centres
    d'art, festivals, médiathèques, bibliothèques) possédant un espace pérenne et
    souhaitant accueillir une exposition d'artistes de la scène française.
a_savoir:
- Dossier obligatoirement en anglais
- Les aides ne peuvent pas être versées à des personnes physiques (structures uniquement)
- Délai d'exécution de 2 ans maximum après attribution
- L'espace de diffusion doit être pérenne, pas de lieux nomades
