analyse:
  synthese: 'Ceci est un guide informationnel publié en 2016 par On the Move en partenariat
    avec l''ASEF, documentant les ressources de financement pour la mobilité artistique
    en Asie. Il recense des opportunités nationales, locales et internationales réparties
    en deux catégories : « outgoing » (artistes asiatiques voyageant à l''étranger)
    et « incoming » (artistes étrangers voyageant en Asie). Le guide compile uniquement
    les opportunités régulières accessibles en ligne (résidences, formations, collaborations,
    tournées). Il s''agit d''un agrégateur, non d''une opportunité de financement
    autonome.'
  pour_qui: Artistes et travailleurs culturels d'Asie souhaitant voyager à l'étranger,
    ainsi que les professionnels d'autres continents désireux de se rendre en Asie.
