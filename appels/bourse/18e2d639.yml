  source_lang: en
  resume_fr: 'Le guide, publié en 2016, recense les ressources de financement nationales,
    locales et internationales pour les artistes et travailleurs culturels en mobilité
    vers ou depuis l''Asie. Il propose deux catégories d''opportunités : les programmes
    pour les résidents asiatiques voyageant à l''étranger et ceux pour les étrangers
    se rendant en Asie. Seules les opportunités régulières avec appels ouverts en
    ligne sont incluses, excluant les ressources disponibles hors ligne ou les programmes
    ponctuels. Depuis 2011, On the Move a publié 60 guides similaires couvrant des
    pays ou régions spécifiques.'
