analyse:
  synthese: La Fondation des Artistes finance depuis 2019 des résidences artistiques
    pour créateurs français à l'étranger. Depuis 2023, un accord avec l'Institut Sacatar
    au Brésil réserve chaque année deux séjours de deux mois, renouvelés pour trois
    années. Les résidences s'adressent aux artistes ayant séjourné à Moly-Sabata ou
    ayant présenté candidature au Prix du Frac Bretagne. La sélection se fait par
    jury. Le programme vise à promouvoir le rayonnement international et enrichir
    les pratiques par immersion dans un nouvel environnement.
  pour_qui: Artistes plasticiens français ou résidant en France, ayant une pratique
    confirmée et figurant parmi les candidats sélectionnés par jury.
