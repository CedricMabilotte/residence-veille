analyse:
  synthese: 'La Fondation des Artistes propose une aide à la production d''oeuvres
    d''art pour les plasticiens ayant un projet de longue durée en France, dotée d''une
    enveloppe annuelle de 500 000 €. L''aide couvre jusqu''à 80 % des dépenses de
    production et intervient en phase de préparation du projet. Aucun critère d''âge,
    de nationalité ou de pratique n''est requis. Le versement s''effectue en deux
    fois : 75 % après décision de la commission, le solde lors de la première présentation
    de l''œuvre sur présentation de justificatifs. La prochaine commission aura lieu
    à l''automne 2026 avec appel à candidatures du 10 août au 11 septembre 2026.'
  pour_qui: Plasticiens (arts plastiques, vidéo, film, etc.) travaillant ou ayant
    un projet de longue durée en France, sans limite d'âge ni critère de nationalité.
a_savoir:
- Aide limitée à la production, exclusion explicite des frais de post-production et
  diffusion
- Montant maximum limité à 80 % des dépenses de production
- Organisme établi depuis 2011 avec historique de soutien (687 projets soutenus pour
  7,6 millions €)
- Solde versé seulement après présentation de l'œuvre et justification des dépenses
