analyse:
  synthese: La Fondation des Artistes propose une aide à la production d'œuvres d'art
    destinée aux plasticiens travaillant ou ayant un projet en France. L'organisme
    verse une bourse couvrant jusqu'à 80% des dépenses de production, hors frais de
    post-production et diffusion. L'aide intervient au premier stade de développement
    du projet. Aucun critère d'âge, de nationalité ou de pratique n'est exigé. Les
    candidatures pour l'automne 2026 se font entre le 10 août et le 11 septembre 2026.
  pour_qui: Plasticiens travaillant ou ayant un projet de longue durée en France,
    sans limite d'âge ou de nationalité.
a_savoir:
- L'aide ne couvre que les frais de production, pas la post-production ou la diffusion
- L'aide ne peut pas dépasser 80% des dépenses de production globale
- 'Versement en deux fois : 75% après décision, solde à la première présentation de
  l''œuvre'
- Programme établi depuis 2011 avec historique de soutien de 687 projets
