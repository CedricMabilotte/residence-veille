analyse:
  synthese: Le Fonds culturel franco-allemand (FCFA), institué en 2003, soutient des
    initiatives de coopération culturelle franco-allemandes conduites dans des pays
    tiers par les réseaux diplomatiques et culturels français et allemands. Depuis
    40 ans, plus de 1200 projets ont été financés dans 144 pays, accompagnant près
    de 300 artistes et intellectuels chaque année. Le fonds couvre 8 disciplines artistiques
    et est abondé à parité par la France et l'Allemagne.
  pour_qui: Artistes, intellectuels et porteurs de projets engagés dans des initiatives
    de coopération culturelle franco-allemande en pays tiers.
