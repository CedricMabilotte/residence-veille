analyse:
  synthese: 'Le Fonds culturel franco-allemand (FCFA), institué en 2003, soutient
    les initiatives de coopération culturelle menées dans des pays tiers par les réseaux
    diplomatiques et culturels français et allemands en collaboration avec des acteurs
    locaux. Ouvert du 16 juillet au 30 octobre 2026, il accepte des projets dans huit
    disciplines : Architecture, Arts Visuels / Photographie, Cinéma, Création numérique,
    Débat d''idées, Livre, Métiers d''art / Design, Spectacle vivant / Musique. Abondé
    à parité par la France et l''Allemagne et géré par l''Institut français depuis
    2011, le Fonds a soutenu plus de 1200 projets dans 144 pays et accompagne près
    de 300 artistes et intellectuels chaque année. Les conditions précises, montants
    et critères de sélection sont réservés aux membres du réseau culturel.'
  pour_qui: Artistes et professionnels culturels français et allemands cherchant à
    développer des projets de coopération culturelle dans des pays tiers.
