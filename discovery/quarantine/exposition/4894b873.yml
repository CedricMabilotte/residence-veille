analyse:
  synthese: Exposition monographique de l'artiste Stéphane Thidet présentée à Rurart
    (Rouillé) du 19 juin au 22 juillet 2018. L'œuvre principale, intitulée 'Sans titre
    (Le Refuge)', est une cabane en bois meublée succinctement où il pleut continuellement
    à l'intérieur, remettant en question la notion de refuge. L'exposition est soutenue
    par plusieurs institutions publiques nationales et locales. Il s'agit d'une archive
    d'exposition passée, non d'un appel à candidature.
  pour_qui: Public intéressé par les installations et sculptures contemporaines jouant
    sur l'absurde et les états d'incertitude.
