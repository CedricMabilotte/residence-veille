analyse:
  synthese: Le programme Province de Carinthie x Cité internationale des arts permet
    chaque année à 2 artistes originaires ou travaillant en Carinthie de venir en
    résidence à la Cité pendant 6 mois. Le programme, créé en 1984, est ouvert à toutes
    les disciplines et s'adresse aussi bien aux artistes émergents qu'aux artistes
    confirmés. Les critères d'éligibilité exigent une pratique dans le champ des arts
    visuels, l'achèvement des études, et une naissance ou une résidence dans le Land
    de Carinthie. Le partenaire de ce programme est le Département des Arts et de
    la Culture de la province de Carinthie, qui soutient financièrement des projets
    artistiques et attribue des bourses à des artistes locaux.
  pour_qui: Artistes originaires ou travaillant en Carinthie, ayant terminé leurs
    études et pratiquant les arts visuels, quel que soit leur niveau de carrière.
