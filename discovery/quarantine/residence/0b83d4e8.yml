  resume_fr: 'Matadero Madrid propose une (1) résidence artistique d''une durée de 9 mois du 1er octobre 2026 au 30 juin 2027,
    destinée à des créateurs, collectifs ou agents culturels travaillant autour de l''art et l''éducation. La résidence porte
    sur deux axes : la médiation étendue et l''art-éducation appliqués aux urgences contemporaines (dissidences du corps,
    activismes antirracistes, urgence climatique, transformations du travail, santé mentale), ou la recherche sur la médiation
    et les croisements art-éducation. Les projets doivent être cohérents avec la trajectoire du candidat et avoir une forte
    composante expérimentale. Les projets exclusivement destinés à la médiation d''expositions, aux centres éducatifs, aux
    arts scéniques ou à la création cinématographique ne sont pas acceptés.'
